<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>星辰回响</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05070d; }
  body { font-family:"Courier New",monospace; color:#e2e8f0;
         touch-action:none; user-select:none; -webkit-user-select:none; }
  #cv { position:fixed; inset:0; display:block; touch-action:none; image-rendering:pixelated; }
  .ov { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
        justify-content:center; gap:18px; background:#05070d; text-align:center; padding:24px; z-index:5; }
  .ov.hidden { display:none; }
  #menu .title { font-size:34px; font-weight:bold; color:#f8fafc; letter-spacing:5px;
                 text-shadow:3px 3px 0 #0284c7, 6px 6px 0 #000; }
  #menu .sub { color:#475569; letter-spacing:7px; font-size:12px; margin-top:-8px; }
  #subtitle .text { font-size:28px; font-weight:bold; color:#f8fafc; letter-spacing:4px;
                    text-shadow:3px 3px 0 #000; }
  button { font-family:"Courier New",monospace; font-weight:bold; font-size:17px;
           background:#4ade80; color:#052e16; border:2px solid #052e16; border-radius:0;
           box-shadow:0 4px 0 #052e16; padding:13px 34px; cursor:pointer; }
  button:active { transform:translateY(3px); box-shadow:0 1px 0 #052e16; }
  #menuBtn { position:fixed; z-index:7; top:calc(10px + env(safe-area-inset-top, 0px));
             right:calc(12px + env(safe-area-inset-right, 0px)); width:44px; height:44px; padding:0;
             background:#4b5462; color:#e2e8f0; border:2px solid #0b0f1a; border-radius:0;
             box-shadow:inset 0 1px 0 #5b6472; font-size:18px;
             display:flex; align-items:center; justify-content:center; }
  #menuBtn:active { transform:translateY(2px); }
  #menuWrap { position:fixed; inset:0; z-index:12; display:flex; align-items:center; justify-content:center; }
  #menuWrap.hidden { display:none; }
  .menu-box { position:relative; display:flex; gap:16px; animation:popIn .16s ease-out; }
  .menu-sq { width:78px; height:78px; padding:0; display:flex; flex-direction:column; align-items:center;
             justify-content:center; gap:4px; background:#4b5462; color:#e2e8f0; border:2px solid #0b0f1a;
             border-radius:0; box-shadow:inset 0 1px 0 #5b6472, 0 3px 0 rgba(0,0,0,.35); font-size:22px; }
  .menu-sq span { font-size:11px; letter-spacing:1px; color:#cbd5e1; }
  .menu-sq:active { transform:translateY(2px); }
  #settingsBackdrop { position:fixed; inset:0; z-index:7; background:rgba(0,0,0,.45); }
  #settingsBackdrop.hidden, #settingsPanel.hidden { display:none; }
  #settingsPanel { position:fixed; z-index:8; top:0; right:0; bottom:0;
           width:min(300px, 74vw); background:#0d1524; border-left:2px solid #1e293b;
           padding:calc(14px + env(safe-area-inset-top, 0px)) 16px 18px;
           display:flex; flex-direction:column; gap:14px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .sp-title { font-size:18px; font-weight:bold; letter-spacing:2px; color:#f8fafc;
              display:flex; justify-content:space-between; align-items:center; }
  .sp-close { background:none; border:none; box-shadow:none; padding:0 6px; color:#94a3b8; font-size:24px; }
  .sp-group { display:flex; flex-direction:column; gap:8px; }
  .sp-label { font-size:14px; color:#cbd5e1; }
  .sp-cap { font-size:12px; color:#cbd5e1; width:40px; flex:none; }
  .sp-group { border-left:2px solid #1e293b; padding-left:8px; }
  .sp-row { display:flex; align-items:center; gap:10px; }
  .sp-toggle { width:50px; padding:7px 0; font-size:13px; background:#475569; color:#e2e8f0;
               border:2px solid #1e293b; box-shadow:0 2px 0 #1e293b; }
  .sp-toggle.on { background:#4ade80; color:#052e16; border-color:#052e16; }
  input[type=range] { flex:1; accent-color:#4ade80; }
  .sp-full { width:100%; background:#3b82f6; color:#eff6ff; border:2px solid #1e3a8a; box-shadow:0 3px 0 #1e3a8a; }
  .sp-page { display:flex; flex-direction:column; gap:12px; }
  .sp-page.hidden { display:none; }
  .sp-alt { background:#475569; color:#e2e8f0; border-color:#1e293b; box-shadow:0 3px 0 #1e293b; }
  .sp-danger { background:#dc2626; color:#fff; border-color:#7f1d1d; box-shadow:0 3px 0 #7f1d1d; }
  textarea { width:100%; min-height:64px; background:#0b1220; color:#cbd5e1; border:2px solid #1e293b;
             border-radius:4px; padding:8px; font-family:inherit; font-size:12px; resize:vertical; }
  #menuNotice { color:#fbbf24; font-size:12px; line-height:1.7; max-width:300px; margin-top:4px; }

  #eqToggle { position:fixed; z-index:11; right:calc(10px + env(safe-area-inset-right, 0px));
              bottom:calc(10px + env(safe-area-inset-bottom, 0px)); width:46px; height:46px; padding:0;
              background:#4b5462; color:#e2e8f0; border:2px solid #0b0f1a; border-radius:0;
              box-shadow:inset 0 1px 0 #5b6472; font-size:14px;
              display:flex; align-items:center; justify-content:center; }
  #interactBtn { position:fixed; z-index:11; right:12%; bottom:24%; width:62px; height:62px; padding:0;
                 background:#4b5462; border:2px solid #0b0f1a; border-radius:50%;
                 box-shadow:inset 0 1px 0 #5b6472, 0 3px 0 rgba(0,0,0,.35);
                 display:flex; align-items:center; justify-content:center; }
  #interactBtn.near { border-color:#f5c542; box-shadow:inset 0 1px 0 #5b6472, 0 0 10px #f5c542; }
  #interactBtn.dim { opacity:.4; }
  #interactBtn.hidden { display:none; }
  #msgToast { position:fixed; z-index:12; left:50%; transform:translateX(-50%);
              bottom:calc(150px + env(safe-area-inset-bottom, 0px)); padding:8px 16px;
              background:rgba(11,15,26,.92); color:#f8fafc; font-size:13px; border:2px solid #3a4250;
              opacity:0; transition:opacity .2s; pointer-events:none; }
  @keyframes popIn { from { transform:scale(.94); opacity:0; } to { transform:scale(1); opacity:1; } }
  .modal-box { animation:popIn .16s ease-out; }
  .item-menu { animation:popIn .12s ease-out; }
  #saveToast { position:fixed; z-index:7; left:50%; transform:translateX(-50%);
               bottom:calc(64px + env(safe-area-inset-bottom, 0px)); color:#4ade80;
               font-size:12px; opacity:0; transition:opacity .25s; pointer-events:none;
               text-shadow:0 1px 2px #000; }
  .pause-ov { position:fixed; inset:0; z-index:14; display:flex; flex-direction:column;
              align-items:center; justify-content:center; gap:18px; background:rgba(5,7,13,.92); }
  .pause-ov.hidden { display:none; }
  .pause-ov h2 { font-size:26px; color:#f8fafc; letter-spacing:6px; }
  #bagBtn { position:fixed; z-index:11; left:calc(10px + env(safe-area-inset-left, 0px));
            bottom:calc(10px + env(safe-area-inset-bottom, 0px)); width:46px; height:46px; padding:0;
            background:#4b5462; border:2px solid #0b0f1a; border-radius:0;
            box-shadow:inset 0 1px 0 #5b6472; display:flex; align-items:center; justify-content:center; }
  #bagBtn:active { transform:translateY(2px); }
  .eq-title { font-size:20px; font-weight:bold; letter-spacing:2px; color:#f8fafc; }
  .eq-section { color:#94a3b8; font-size:13px; margin-top:10px; letter-spacing:1px; }
  .eq-grid { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:340px; }
  .eq-slot { width:46px; height:46px; background:#4b5462; border:2px solid #0b0f1a;
             display:flex; align-items:center; justify-content:center; color:#2b3444;
             font-size:12px; font-weight:bold; }
  #itemMenu { position:fixed; inset:0; z-index:12; background:transparent; }
  #itemMenu.hidden { display:none; }
  .item-menu { position:absolute; background:#3b2a1c; border:2px solid #241810;
               padding:8px; display:flex; flex-direction:column; gap:6px; min-width:120px;
               box-shadow:0 4px 0 rgba(0,0,0,.35); }
  .item-menu .menu-head { font-size:11px; color:#c9a97f; text-align:center; padding-bottom:2px; }
  .item-menu button { width:100%; background:#5a412c; color:#f3e3cc; border:2px solid #241810;
                      box-shadow:0 2px 0 #241810; font-size:14px; padding:9px 12px; }
  .item-menu button:active { transform:translateY(2px); box-shadow:0 0 0 #241810; }
  .detail-box { position:relative; background:#3b2a1c; border:2px solid #241810; padding:14px;
                width:min(360px, 88vw); max-height:80vh; overflow-y:auto; color:#f3e3cc;
                display:flex; flex-direction:column; gap:10px; }
  .detail-head { display:flex; align-items:center; gap:10px; }
  .detail-name { font-size:15px; font-weight:bold; color:#f8e9d2; flex:1; }
  .detail-desc { background:#2b1d12; border:1px solid #1c130c; padding:9px; color:#ffffff;
                 font-size:13px; line-height:1.7; min-height:52px; }
  .detail-row { display:flex; justify-content:space-between; font-size:13px;
                padding:5px 2px; border-bottom:1px dashed #5a4330; color:#e6d3b8; }
  .detail-row b { color:#ffd9a0; font-weight:normal; }
  .detail-sec { font-size:12px; color:#a98d6c; letter-spacing:1px; }
  .modal { position:fixed; inset:0; z-index:9; display:flex; align-items:center; justify-content:center; }
  .modal.hidden { display:none; }
  .modal-bg { position:absolute; inset:0; background:rgba(110,116,128,.45); }
  .modal-box { position:relative; background:#0d1524; border:2px solid #1e293b; padding:16px;
               width:min(420px, 88vw); max-height:82vh; overflow-y:auto;
               display:flex; flex-direction:column; gap:10px; align-items:center; }
  .cat-row { display:flex; gap:6px; width:100%; }
  .catBtn { flex:1; padding:7px 0; font-size:12px; background:#4b5462; color:#cbd5e1;
            border:2px solid #0b0f1a; box-shadow:none; border-radius:0; }
  .catBtn.on { background:#f5c542; color:#3b2a1c; border-color:#8a6a1a; }
  .eq-slot.hl { border-color:#f5c542; }
  .eq-slot.sel { box-shadow:inset 0 0 0 1px #ffffff; }
  .bag-grid { display:grid; grid-template-columns:repeat(6, 1fr); gap:4px;
              width:100%; max-height:52vh; overflow-y:scroll; overflow-x:hidden;
              scrollbar-width:thin; }
  .bag-grid::-webkit-scrollbar { width:10px; }
  .bag-grid::-webkit-scrollbar-track { background:#0b1220; border:1px solid #1e293b; }
  .bag-grid::-webkit-scrollbar-thumb { background:#4b5462; border:2px solid #0b1220; }
  .pixlabel { display:inline-flex; align-items:center; }
  .pixlabel canvas { image-rendering:pixelated; display:block; }
  .panel-head { display:flex; align-items:center; gap:10px; width:100%; }
  .panel-head .xBtn { margin-left:auto; }
  .xBtn { width:26px; height:26px; padding:0; font-size:13px; line-height:1;
          background:#4b5462; color:#e2e8f0; border:2px solid #0b0f1a; box-shadow:none;
          display:flex; align-items:center; justify-content:center; }
  .xBtn:active { transform:translateY(2px); }
  .pixlabel canvas { image-rendering:pixelated; display:block; }
  .eq-cols { display:flex; gap:20px; align-items:flex-start; }
  .eq-col { display:flex; flex-direction:column; gap:8px; }
  .eq-cap { font-size:12px; color:#94a3b8; letter-spacing:2px; text-align:left; width:100%; }
  .eq-row { display:flex; gap:8px; }
  .eq-box .eq-slot { width:52px; height:52px; }
  .bag-grid .eq-slot { width:100%; height:auto; aspect-ratio:1/1; }
  #rotate { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center;
            justify-content:center; gap:18px; background:#05070d; color:#e2e8f0; text-align:center; padding:24px; }
  #rotate.hidden { display:none; }
  #rotate .icon { font-size:56px; animation:rot 2.4s ease-in-out infinite; }
  #rotate .t { font-size:20px; font-weight:bold; letter-spacing:2px; }
  #rotate .d { color:#64748b; font-size:13px; }
  @keyframes rot { 0%,100%{transform:rotate(0)} 50%{transform:rotate(90deg)} }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="menuBtn">☰</button>
<div id="menuWrap" class="hidden">
  <div class="modal-bg" id="menuWrapBg"></div>
  <div class="menu-box">
    <button class="menu-sq" id="mTitle">🏠<span>标题</span></button>
    <button class="menu-sq" id="settingsBtn">⚙<span>设置</span></button>
    <button class="menu-sq" id="pauseBtn">❚❚<span>暂停</span></button>
  </div>
</div>
<button id="eqToggle">▼</button>
<button id="interactBtn" class="hidden">
  <svg width="30" height="30" viewBox="0 0 12 12" shape-rendering="crispEdges">
    <rect x="4" y="1" width="1" height="4" fill="#f0d0ae"/>
    <rect x="6" y="0" width="1" height="5" fill="#f0d0ae"/>
    <rect x="8" y="1" width="1" height="4" fill="#f0d0ae"/>
    <rect x="3" y="4" width="7" height="5" fill="#f0d0ae"/>
    <rect x="4" y="9" width="5" height="2" fill="#d8b48f"/>
    <rect x="2" y="5" width="1" height="2" fill="#f0d0ae"/>
  </svg>
</button>
<div id="msgToast"></div>
<div id="saveToast"></div>
<div id="pauseWrap" class="pause-ov hidden">
  <h2>已暂停</h2>
  <button id="resumeBtn" class="sp-full" style="width:auto;padding:12px 30px">继续游戏</button>
</div>
<button id="bagBtn">
  <svg width="26" height="26" viewBox="0 0 12 12" shape-rendering="crispEdges">
    <rect x="4" y="1" width="4" height="1" fill="#1e293b"/>
    <rect x="3" y="2" width="1" height="2" fill="#1e293b"/>
    <rect x="8" y="2" width="1" height="2" fill="#1e293b"/>
    <rect x="3" y="3" width="6" height="1" fill="#6b4a2e"/>
    <rect x="2" y="4" width="8" height="7" fill="#8a6440"/>
    <rect x="2" y="7" width="8" height="1" fill="#5f4127"/>
    <rect x="4" y="8" width="4" height="3" fill="#a87c50"/>
    <rect x="5" y="6" width="2" height="1" fill="#d4b24a"/>
  </svg>
</button>
<div id="equipWrap" class="modal hidden">
  <div class="modal-bg" id="equipBg"></div>
  <div class="modal-box eq-box">
    <div class="panel-head">
      <span class="pixlabel" id="eqTitle"></span>
      <button class="xBtn" id="eqClose">✕</button>
    </div>
    <div class="eq-cols">
      <div class="eq-col">
        <div class="eq-cap pixlabel" id="capW"></div>
        <div class="eq-row" id="eqWrow"></div>
        <div class="eq-cap pixlabel" id="capA"></div>
        <div class="eq-row" id="eqArow"></div>
      </div>
      <div class="eq-col">
        <div class="eq-cap pixlabel" id="capAcc"></div>
        <div class="eq-row" id="eqXrow1"></div>
        <div class="eq-row" id="eqXrow2"></div>
      </div>
    </div>
  </div>
</div>
<div id="itemMenu" class="hidden">
  <div class="item-menu" id="itemMenuBox"></div>
</div>
<div id="itemDetail" class="modal hidden" style="z-index:13">
  <div class="modal-bg" id="itemDetailBg"></div>
  <div class="detail-box">
    <div class="detail-head">
      <span id="detailIcon"></span>
      <span class="detail-name" id="detailName"></span>
      <button class="xBtn" id="detailClose">✕</button>
    </div>
    <div class="detail-sec">描述</div>
    <div class="detail-desc" id="detailDesc">（描述待补全）</div>
    <div class="detail-sec">属性</div>
    <div id="detailRows"></div>
  </div>
</div>
<div id="bagWrap" class="modal hidden" style="z-index:10">
  <div class="modal-bg" id="bagBg"></div>
  <div class="modal-box">
    <div class="panel-head">
      <span class="pixlabel" id="bagTitle"></span>
      <span class="pixlabel" id="bagCap"></span>
      <button class="xBtn" id="bagClose">✕</button>
    </div>
    <div class="cat-row">
      <button class="catBtn on" data-f="all">全部</button>
      <button class="catBtn" data-f="weapon">武器</button>
      <button class="catBtn" data-f="armor">防具</button>
      <button class="catBtn" data-f="acc">饰品</button>
      <button class="catBtn" id="bagSort">整理</button>
    </div>
    <div class="bag-grid" id="bagGrid"></div>
  </div>
</div>
<div id="settingsBackdrop" class="hidden"></div>
<div id="settingsPanel" class="hidden">
  <div class="sp-title">设置<button id="settingsClose" class="sp-close">×</button></div>
  <div id="spMain" class="sp-page">
    <div class="sp-label">游戏</div>
    <div class="sp-group">
      <button id="pauseGameBtn" class="sp-full sp-alt">暂停游戏</button>
      <button id="titleBtn" class="sp-full sp-alt">回到标题界面</button>
    </div>
    <div class="sp-label">音频</div>
    <div class="sp-group">
      <div class="sp-row"><span class="sp-cap">音乐</span><button id="musicToggle" class="sp-toggle on">开</button><input type="range" id="musicVol" min="0" max="100" value="60"></div>
      <div class="sp-row"><span class="sp-cap">音效</span><button id="sfxToggle" class="sp-toggle on">开</button><input type="range" id="sfxVol" min="0" max="100" value="70"></div>
      <button id="muteAll" class="sp-full sp-alt">一键静音：关</button>
    </div>
    <div class="sp-label">显示</div>
    <div class="sp-group">
      <button id="fullscreenBtn" class="sp-full">全屏</button>
    </div>
    <div class="sp-label">操作</div>
    <div class="sp-group">
      <button id="vibToggle" class="sp-full sp-alt">振动：开</button>
      <div class="sp-row"><span class="sp-cap">震感</span><input type="range" id="vibPower" min="0" max="100" value="100"></div>
      <button id="autoPauseToggle" class="sp-full sp-alt">打开菜单自动暂停：开</button>
    </div>
    <div class="sp-label">数据</div>
    <div class="sp-group">
      <button id="openSave" class="sp-full sp-alt">存档</button>
    </div>
  </div>
  <div id="spSave" class="sp-page hidden">
    <div class="sp-label">存档管理</div>
    <button id="saveExport" class="sp-full">导出存档文件</button>
    <button id="saveImportBtn" class="sp-full">导入存档文件</button>
    <input type="file" id="saveFile" style="display:none">
    <div class="sp-label">存档码</div>
    <textarea id="saveCodeShow" readonly placeholder="点下方按钮生成存档码"></textarea>
    <button id="saveCodeGen" class="sp-full sp-alt">生成并复制存档码</button>
    <textarea id="saveCodeIn" placeholder="把存档码粘贴到这里"></textarea>
    <button id="saveCodeLoad" class="sp-full">用存档码导入</button>
    <button id="saveClear" class="sp-full sp-danger">清除存档数据</button>
    <button id="saveBack" class="sp-full sp-alt">返回</button>
  </div>
</div>

<div id="menu" class="ov">
  <div class="title">星辰回响</div>
  <div class="sub">STELLAR ECHO</div>
  <button id="startBtn">开始游戏</button>
  <button id="titleLoadBtn" style="background:#4b5462;color:#e2e8f0;border-color:#0b0f1a;box-shadow:0 3px 0 #0b0f1a;font-size:14px;padding:9px 20px">导入存档 / 存档码</button>
  <div id="menuNotice">⚠ 清除浏览器缓存会导致存档丢失，建议在「设置 → 存档」里导出备份或保存存档码</div>
</div>
<div id="subtitle" class="ov hidden">
  <div class="text">到达主城</div>
</div>
<div id="titleLoad" class="modal hidden" style="z-index:13">
  <div class="modal-bg" id="titleLoadBg"></div>
  <div class="modal-box">
    <div class="eq-title">导入存档</div>
    <button id="tlFile" class="sp-full">选择存档文件</button>
    <input type="file" id="tlFileInput" style="display:none">
    <div class="sp-label">或粘贴存档码</div>
    <textarea id="tlCode" placeholder="把存档码粘贴到这里"></textarea>
    <button id="tlImport" class="sp-full">导入存档码</button>
    <button id="tlClose" class="sp-full sp-alt">关闭</button>
  </div>
</div>
<div id="rotate" class="hidden">
  <div class="icon">📱</div>
  <div class="t">请把手机横过来</div>
  <div class="d">横屏游玩体验更好</div>
</div>

<script>
"use strict";
let VW=352, VH=176;
const TILE=16, WCOLS=64, WROWS=44;
const RES=2;   // 内部渲染精度：2 倍，像素视觉大小不变，但镜头可半格移动
const WORLD_W=WCOLS*TILE, WORLD_H=WROWS*TILE;
let JBX=70, JBY=140; const JR=26;   // 常驻摇杆位置（左下，随屏幕）
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const off = document.createElement('canvas'); off.width=VW*RES; off.height=VH*RES;
let octx = off.getContext('2d'); octx.imageSmoothingEnabled=false; octx.setTransform(RES,0,0,RES,0,0);
// 静态地面预渲染
const groundCanvas = document.createElement('canvas');
groundCanvas.width = WORLD_W*RES; groundCanvas.height = WORLD_H*RES;
const gctx = groundCanvas.getContext('2d');
gctx.imageSmoothingEnabled = false;
gctx.setTransform(RES,0,0,RES,0,0);

let cssScale=1, oxCss=0, oyCss=0, dpr=1;
function resize(){
  dpr = window.devicePixelRatio || 1;
  const W = window.innerWidth, H = window.innerHeight;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  cv.style.width = W+'px'; cv.style.height = H+'px';
  // 每个美术像素占 P 个设备像素（偶数，配合 2 倍内部渲染）
  let P = Math.round(Math.min(cv.width, cv.height)/195);
  P = Math.max(4, P - (P%2));
  cssScale = P;
  // 可视区域随屏幕自适应，填满
  VW = Math.min(WORLD_W, Math.floor(cv.width/P));
  VH = Math.min(WORLD_H, Math.floor(cv.height/P));
  off.width = VW*RES; off.height = VH*RES;
  octx.imageSmoothingEnabled = false;
  octx.setTransform(RES,0,0,RES,0,0);
  oxCss = Math.floor((cv.width - VW*P)/2);
  oyCss = Math.floor((cv.height - VH*P)/2);
  ctx.imageSmoothingEnabled = false;
  JBX = VW*0.15; JBY = VH*0.82;
}

// ---------- 确定性随机 ----------
function hash(x,y){
  let h = (x|0)*374761393 + (y|0)*668265263;
  h = (h ^ (h>>>13)) * 1274126177;
  return ((h ^ (h>>>16)) >>> 0) / 4294967295;
}

}

// ---------- 路面遮罩（2 像素一格，边缘随机） ----------
const MW=Math.ceil(WORLD_W/2), MH=Math.ceil(WORLD_H/2);
const roadMask=new Uint8Array(MW*MH);
const tileRoadCnt=new Uint8Array(WCOLS*WROWS);
for(let my=0;my<MH;my++) for(let mx=0;mx<MW;mx++){
  const wx=mx*2+1, wy=my*2+1;
  let best=1e9;
  for(const r of ROADS){ const d=segDist(wx,wy,r.x1,r.y1,r.x2,r.y2)-r.w/2; if(d<best) best=d; }
  const n=(hash(mx*7+3,my*5+1)-0.5)*6;
  roadMask[my*MW+mx]=(best+n<0)?1:0;
}
for(let ty=0;ty<WROWS;ty++) for(let tx=0;tx<WCOLS;tx++){
  let c=0;
  for(let j=0;j<8;j++) for(let i=0;i<8;i++) c+=roadMask[(ty*8+j)*MW+(tx*8+i)]||0;
  tileRoadCnt[ty*WCOLS+tx]=c;
}

// ---------- 河流与桥 ----------
const RIVER={x1:-30,y1:540,x2:1060,y2:540,w:78};
const BRIDGE={x:655,y:490,w:48,h:104};
const waterMask=new Uint8Array(MW*MH);
const tileWaterCnt=new Uint8Array(WCOLS*WROWS);
for(let my=0;my<MH;my++) for(let mx=0;mx<MW;mx++){
  const wx=mx*2+1, wy=my*2+1;
  let d=segDist(wx,wy,RIVER.x1,RIVER.y1,RIVER.x2,RIVER.y2)-RIVER.w/2;
  d += (hash(mx*3+7,my*9+2)-0.5)*7;
  waterMask[my*MW+mx]=(d<0)?1:0;
}
for(let ty=0;ty<WROWS;ty++) for(let tx=0;tx<WCOLS;tx++){
  let c=0;
  for(let j=0;j<8;j++) for(let i=0;i<8;i++) c+=waterMask[(ty*8+j)*MW+(tx*8+i)]||0;
  tileWaterCnt[ty*WCOLS+tx]=c;
}
function waterAt(px,py){
  if(px>BRIDGE.x&&px<BRIDGE.x+BRIDGE.w&&py>BRIDGE.y&&py<BRIDGE.y+BRIDGE.h) return false;
  const mx=Math.floor(px/2), my=Math.floor(py/2);
  if(mx<0||my<0||mx>=MW||my>=MH) return false;
  return waterMask[my*MW+mx]===1;
}

const borderDeco = [];
(()=>{
  for(let y=0;y<WROWS;y++) for(let x=0;x<WCOLS;x++){
    if(world[y][x]!==2) continue;
    if(hash(x*7+1,y*11+3) < 0.22) continue;
    const jx=(hash(x+9,y+4)-0.5)*TILE*0.8;
    const jy=(hash(x+2,y+8)-0.5)*TILE*0.8;
    const s=0.6+hash(x+5,y+7)*1.0;
    const t=hash(x+3,y+9);
    let type;
    if(t<0.28) type='tree';
    else if(t<0.40) type='pine';
    else if(t<0.58) type='mound';
    else if(t<0.72) type='bush';
    else if(t<0.84) type='grass';
    else if(t<0.93) type='flower';
    else type='rock';
    borderDeco.push({type, x:x*TILE+TILE/2+jx, y:y*TILE+TILE/2+jy, s, v:hash(x+1,y+2)});
  }
})();

// ---------- 碰撞 ----------
function solidAt(px,py){
  const tx=Math.floor(px/TILE), ty=Math.floor(py/TILE);
  if(tx<0||ty<0||tx>=WCOLS||ty>=WROWS) return true;
  if(world[ty][tx]!==0) return true;
  for(const b of BUILDINGS){ if(px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h) return true; }
  for(const p of PROPS){
    let x0,y0,x1,y1;
    if(p.type==='well'){ x0=p.x-14; y0=p.y-8; x1=p.x+14; y1=p.y+1; }
    else if(p.type==='flower'){ x0=p.x-13; y0=p.y-7; x1=p.x+13; y1=p.y+1; }
    else if(p.type==='crate'){ x0=p.x-6; y0=p.y-10; x1=p.x+6; y1=p.y; }
    else if(p.type==='lamp'){ x0=p.x-3; y0=p.y-24; x1=p.x+3; y1=p.y; }
    else if(p.type==='fence'){ x0=p.x; y0=p.y-12; x1=p.x+(p.n||5)*6; y1=p.y; }
    else continue;
    if(px>=x0&&px<=x1&&py>=y0&&py<=y1) return true;
  }
  if(waterAt(px,py)) return true;
  return false;
}
function tryMove(dx,dy){
  const half=5, nx=player.x+dx, ny=player.y+dy;
  const ok=(x,y)=> !solidAt(x,y)&&!solidAt(x-half,y-half)&&!solidAt(x+half,y-half)&&!solidAt(x-half,y+half)&&!solidAt(x+half,y+half);
  if(ok(nx,ny)){ player.x=nx; player.y=ny; return; }
  if(ok(nx,player.y)) player.x=nx;
  if(ok(player.x,ny)) player.y=ny;
}

function update(dt){
  if(joy.active){
    const d=Math.hypot(joy.dx,joy.dy);
    if(d>2){
      tryMove(joy.dx/d*player.speed*dt, joy.dy/d*player.speed*dt);
      walkPhase += dt*16;
      const si=Math.floor(walkPhase/Math.PI);
      if(si!==lastStep){ lastStep=si; playStep(); if(si%2===0) vibrate(1); }
      if(joy.dx>2) player.face=1; else if(joy.dx<-2) player.face=-1;
    }
  }
  if(!(joy.active && Math.hypot(joy.dx,joy.dy)>2)) walkPhase = 0;
  if(solidAt(player.x,player.y)){
    let freed=false;
    for(const d of [[0,-4],[0,4],[-4,0],[4,0],[-4,-4],[4,-4],[-4,4],[4,4],[0,-8],[0,8],[-8,0],[8,0]]){
      if(!solidAt(player.x+d[0],player.y+d[1])){ player.x+=d[0]; player.y+=d[1]; freed=true; break; }
    }
    if(!freed){ player.x=680; player.y=448; }
  }
  const tcx=Math.max(0, Math.min(WORLD_W-VW, player.x-VW/2));
  const tcy=Math.max(0, Math.min(WORLD_H-VH, player.y-VH/2));
  const k=1-Math.exp(-dt*12);
  camXs += (tcx-camXs)*k;
  camYs += (tcy-camYs)*k;
  if(!isFinite(camXs)||!isFinite(camYs)){ camXs=tcx; camYs=tcy; }
  updateInteract();
  camX = Math.round(camXs*RES)/RES;
  camY = Math.round(camYs*RES)/RES;
}

// ---------- 绘制 ----------
function px(x,y,w,h,c){ octx.fillStyle=c; octx.fillRect(Math.round(x*RES)/RES,Math.round(y*RES)/RES,Math.round(w*RES)/RES,Math.round(h*RES)/RES); }
function fillCircle(x,y,r,c){ octx.fillStyle=c; octx.beginPath(); octx.arc(x,y,r,0,7); octx.fill(); }

function drawGrass(sx,sy,tx,ty){
  const h=hash(tx,ty);
  if(h<0.2){ octx.fillStyle='#74a852'; octx.fillRect(sx,sy,TILE,TILE); }
  else if(h>0.55 && h<0.65){ octx.fillStyle='#88bf66'; octx.fillRect(sx,sy,TILE,TILE); }
  for(let i=0;i<3;i++){
    const bx=sx+Math.floor(hash(tx*7+i,ty*13+i)*(TILE-2));
    const by=sy+Math.floor(hash(tx*3+i,ty*5+i)*(TILE-3));
    px(bx,by,1,2,'#639a45');
  }
  if(h>0.92){
    const fx=sx+4+Math.floor(hash(tx,ty)*6), fy=sy+4+Math.floor(hash(ty,tx)*6);
    px(fx,fy,2,2,'#fde047'); px(fx+1,fy+1,1,1,'#f59e0b');
  } else if(h<0.05){
    px(sx+5,sy+8,4,3,'#9aa5b1'); px(sx+6,sy+7,2,1,'#b4bec8');
  } else if(h>0.82 && h<0.86){
    px(sx+9,sy+10,5,4,'#4e7d36'); px(sx+10,sy+9,3,2,'#5f9440');
  }
}
function segDist(px,py,x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1, l2=dx*dx+dy*dy;
  let t = l2 ? ((px-x1)*dx+(py-y1)*dy)/l2 : 0;
  t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
}
function roadVal(tx,ty){
  const cx=tx*TILE+TILE/2, cy=ty*TILE+TILE/2;
  let best=1e9;
  for(const r of ROADS){
    const d=segDist(cx,cy,r.x1,r.y1,r.x2,r.y2)-r.w/2;
    if(d<best) best=d;
  }
  const n=(hash(tx*5+1,ty*7+3)-0.5)*10;
  const v=best+n;
  if(v<=-7) return 1;
  if(v>=7) return 0;
  return (7-v)/14;
}
function drawDirt(sx,sy,tx,ty,rv){
  octx.fillStyle='#c9a96b'; octx.fillRect(sx,sy,TILE,TILE);
  for(let i=0;i<3;i++){
    const bx=sx+Math.floor(hash(tx*7+i,ty*11+i)*(TILE-2));
    const by=sy+Math.floor(hash(tx*3+i,ty*5+i)*(TILE-2));
    px(bx,by,2,1, hash(tx+i,ty+i)>0.5?'#d8bd85':'#b08f55');
  }
  // 边缘随机混草，形成不规则路沿
  if(rv<0.85){
    const n=Math.floor((1-rv)*9);
    for(let i=0;i<n;i++){
      const bx=sx+Math.floor(hash(tx*13+i,ty*7+i)*TILE);
      const by=sy+Math.floor(hash(tx*5+i,ty*13+i)*TILE);
      px(bx,by,2,1,'#7db25a');
    }
  }
  if(hash(tx,ty)>0.85) px(sx+6,sy+9,3,2,'#9aa5b1');
}
function drawGroundTile(sx,sy,tx,ty){
  const cnt=tileRoadCnt[ty*WCOLS+tx];
  if(cnt===0){ drawGrass(sx,sy,tx,ty); return; }
  if(cnt>=64){ drawDirt(sx,sy,tx,ty,1); return; }
  drawGrass(sx,sy,tx,ty);
  for(let j=0;j<8;j++) for(let i=0;i<8;i++){
    if(roadMask[(ty*8+j)*MW+(tx*8+i)]){
      px(sx+i*2, sy+j*2, 2, 2, hash(tx*8+i,ty*8+j)>0.5?'#c9a96b':'#bfa06a');
    }
  }
}
function drawWaterTile(sx,sy,tx,ty){
  const cnt=tileWaterCnt[ty*WCOLS+tx];
  if(cnt===0){ drawGroundTile(sx,sy,tx,ty); return; }
  if(cnt>=64){
    px(sx,sy,TILE,TILE,'#2f6fb0');
    if(hash(tx,ty)>0.5){ px(sx+3,sy+5,5,1,'#4a8fd4'); px(sx+9,sy+11,4,1,'#4a8fd4'); }
    else { px(sx+5,sy+9,6,1,'#4a8fd4'); }
    return;
  }
  drawGrass(sx,sy,tx,ty);
  for(let j=0;j<8;j++) for(let i=0;i<8;i++){
    if(waterMask[(ty*8+j)*MW+(tx*8+i)]) px(sx+i*2, sy+j*2, 2,2, '#2f6fb0');
  }
}
function drawBridge(){
  const b=BRIDGE, x=b.x-camX, y=b.y-camY, w=b.w, h=b.h;
  px(x, y, w, h, '#9a7248');
  for(let yy=y; yy<y+h; yy+=6) px(x, yy, w, 1, '#7a5a36');
  px(x, y, 3, h, '#6b4a2e');
  px(x+w-3, y, 3, h, '#6b4a2e');
  for(let yy=y+6; yy<y+h; yy+=16){ px(x, yy, 3, 3, '#5a3a1f'); px(x+w-3, yy, 3, 3, '#5a3a1f'); }
}

function drawHouse(b){
  const x=Math.round((b.x-camX)*RES)/RES, y=Math.round((b.y-camY)*RES)/RES, w=b.w, h=b.h;
  if(x+w<-20||x>VW+20||y+h<-20||y>VH+20) return;
  const st=HSTYLES[(b.v||0)%HSTYLES.length];
  const pal=st.palettes[(b.c||0)%st.palettes.length];
  const roofH=Math.round(h*0.46);
  const wallTop=y+roofH;
  const baseY=y+h-8;

  px(x+6, y+h+1, w-12, 3, 'rgba(0,0,0,.16)');
  px(x+2, y+h+3, w-4, 2, 'rgba(0,0,0,.12)');

  px(x+4, wallTop-2, w-8, h-roofH+2, pal.wallA);
  px(x+4, wallTop+Math.round((h-roofH)*0.55), w-8, Math.round((h-roofH)*0.45)+2, pal.wallB);

  px(x+4, baseY, w-8, 8, '#8d8a80');
  for(let i=0;i<w-8;i+=7) px(x+4+i, baseY, 1, 8, '#6f6c63');
  px(x+4, baseY, w-8, 1, '#a6a298');

  if(st.type==='stone'){
    for(let yy=wallTop+5; yy<baseY-2; yy+=6) px(x+4, yy, w-8, 1, '#939aa0');
    px(x+4, wallTop-2, w-8, 2, '#9aa0a6');
  } else {
    px(x+4, wallTop-2, 3, h-roofH+2, pal.beam);
    px(x+w-7, wallTop-2, 3, h-roofH+2, pal.beam);
    px(x+4, wallTop-2, w-8, 2, pal.beam);
    px(x+4, baseY-2, w-8, 2, pal.beam);
    if(st.type==='shop'){ for(let i=0;i<3;i++) px(x+9+i, wallTop+3+i*5, 2, 5, pal.beam); }
  }

  // 烟囱：只给带 ch 的房子，先画再被屋顶盖住
  if(b.ch){
    const chDx=w*(st.type==='shop'?-0.24:0.22);
    const chT=Math.min(0.85, Math.max(0,(Math.abs(chDx)-3)/(w/2+2)));
    const chSurf=y+chT*roofH;
    const chCx=x+w/2+chDx;
    px(chCx-5, chSurf-13, 10, 22, '#8d8a80');
    for(let i=0;i<4;i++) px(chCx-5, chSurf-13+i*5, 10, 1, '#6f6c63');
    px(chCx-6, chSurf-14, 12, 2, '#a6a298');
  }

  const steps=Math.ceil(roofH/4);
  for(let s2=0;s2<steps;s2++){
    const t=s2/steps;
    const halfW=3 + t*(w/2+2);
    const top=y+s2*4;
    const hgt=Math.min(4, roofH-s2*4);
    const l=x+w/2-halfW, r=x+w/2+halfW;
    const col=(s2%2===0)?pal.roofA:pal.roofB;
    px(l, top, r-l, hgt, col);
    px(l, top, r-l, 1, s2%2===0?'rgba(255,255,255,.14)':pal.roofA);
  }
  px(x+w/2-4, y-1, 8, 2, st.type==='thatched'?'#e0c070':'#d9a05a');
  px(x+2, wallTop-2, w-4, 2, 'rgba(0,0,0,.16)');

  const fv=(b.f||0)%3;
  if(st.type==='shop'){
    const wy=wallTop+7, wh=12, wx=x+8, ww=w-16;
    px(wx-1, wy-1, ww+2, wh+2, pal.beam);
    px(wx, wy, ww, wh, '#3a2a1a');
    px(wx+1, wy+1, ww-2, wh-2, '#fcd34d');
    px(wx+Math.floor(ww/2), wy+1, 1, wh-2, pal.beam);
    px(wx+Math.floor(ww/4), wy+1, 1, wh-2, pal.beam);
    px(wx+Math.floor(ww*3/4), wy+1, 1, wh-2, pal.beam);
    px(x+w/2-12, wallTop+2, 24, 3, pal.beam);
    px(x+w/2-10, wallTop+1, 20, 2, '#c9a96b');
    if(fv===1){
      for(let i=0;i<ww;i+=6) px(wx+i, wy-6, Math.min(6,ww-i), 4, (i/6)%2===0?'#c94f4f':'#f2e2c4');
      px(wx-1, wy-7, ww+2, 1, pal.beam);
    }
    const dw=16, dh=Math.min(20, h-roofH-8);
    const dx=x+w/2-dw/2, dy=y+h-dh;
    px(dx-1, dy-1, dw+2, dh+1, pal.beam);
    px(dx, dy, dw, dh, '#6b4423');
    px(dx+2, dy+2, dw-4, dh-4, '#7d5230');
    px(dx+dw-5, dy+Math.floor(dh/2), 2, 2, '#d4b24a');
    px(x+w-10, y+h-11, 6, 10, '#6b4a2e');
    px(x+w-10, y+h-9, 6, 1, '#8a6440');
    px(x+w-10, y+h-6, 6, 1, '#8a6440');
  } else if(st.type==='stone'){
    const wy=wallTop+6, wh=9;
    const win=(wx)=>{
      px(wx-1, wy-1, wh+2, wh+2, '#5a5e64');
      px(wx, wy, wh, wh, '#2b2b33');
      px(wx+1, wy+1, wh-2, wh-2, '#fcd34d');
    };
    if(fv===1){
      const rc=Math.round(x+w/2), ry=wallTop+Math.round((h-roofH)/2)-2;
      px(rc-4, ry-4, 9, 8, '#5a5e64');
      px(rc-3, ry-3, 7, 6, '#2b2b33');
      px(rc-2, ry-2, 5, 4, '#fcd34d');
      px(rc-1, ry, 1, 1, '#5a5e64');
    } else {
      win(x+9); win(x+w-9-wh);
    }
    const dw=13, dh=Math.min(20, h-roofH-8);
    const dx=x+w/2-dw/2, dy=y+h-dh;
    px(dx-1, dy-2, dw+2, dh+2, '#5a5e64');
    px(dx, dy+2, dw, dh-2, '#6b4423');
    px(dx+2, dy, dw-4, 3, '#6b4423');
    px(dx+dw-4, dy+Math.floor(dh/2), 2, 2, '#d4b24a');
  } else {
    const wy=wallTop+6, wh=10;
    const win=(wx)=>{
      px(wx-1, wy-1, wh+2, wh+2, pal.beam);
      px(wx, wy, wh, wh, '#3a2a1a');
      px(wx+1, wy+1, wh-2, wh-2, '#fcd34d');
      px(wx+Math.floor(wh/2), wy+1, 1, wh-2, pal.beam);
      px(wx+1, wy+Math.floor(wh/2), wh-2, 1, pal.beam);
      px(wx-1, wy+wh+1, wh+2, 3, '#7a5a33');
      px(wx+2, wy+wh+1, 2, 2, '#f472b6');
      px(wx+6, wy+wh+1, 2, 2, '#fde047');
    };
    if(fv===1){
      const ww2=Math.max(18, w-30), wx2=x+Math.round((w-ww2)/2), wy2=wallTop+6;
      px(wx2-1, wy2-1, ww2+2, 12, pal.beam);
      px(wx2, wy2, ww2, 10, '#3a2a1a');
      px(wx2+1, wy2+1, ww2-2, 8, '#fcd34d');
      px(wx2+Math.floor(ww2/2), wy2+1, 1, 8, pal.beam);
      px(wx2+Math.floor(ww2/3), wy2+1, 1, 8, pal.beam);
    } else if(fv===2){
      const win2=(wx)=>{
        px(wx-1, wy-1, wh+2, wh+2, pal.beam);
        px(wx, wy, wh, wh, '#3a2a1a');
        px(wx+1, wy+1, wh-2, wh-2, '#fcd34d');
        px(wx+Math.floor(wh/2), wy+1, 1, wh-2, pal.beam);
      };
      win2(x+10); win2(x+w-10-wh);
      px(x+3, wallTop+7, 1, 10, '#3a6a2c');
      px(x+4, wallTop+9, 2, 1, '#4e8538');
      px(x+4, wallTop+13, 2, 1, '#4e8538');
    } else {
      win(x+10); win(x+w-10-wh);
    }
    const dw=14, dh=Math.min(22, h-roofH-8);
    const dx=x+w/2-dw/2, dy=y+h-dh;
    px(dx-1, dy-2, dw+2, dh+2, pal.beam);
    px(dx, dy+2, dw, dh-2, '#6b4423');
    px(dx+2, dy, dw-4, 3, '#6b4423');
    px(dx+2, dy+3, dw-4, dh-5, '#7d5230');
    for(let i=0;i<3;i++) px(dx+3+i*4, dy+4, 1, dh-6, '#5f3c1f');
    px(dx+dw-4, dy+Math.floor(dh/2)+1, 2, 2, '#d4b24a');
    px(x+w/2+11, dy-6, 3, 4, '#fbbf24');
  }
}

let groundOK = false;
function buildGround(){
  try{
    baking = true;
    const saved = octx;
    const sx0=camX, sy0=camY;
    octx = gctx; camX=0; camY=0;
    octx.clearRect(0,0,WORLD_W,WORLD_H);
    for(let ty=0; ty<WROWS; ty++) for(let tx=0; tx<WCOLS; tx++){
      const sx=tx*TILE, sy=ty*TILE, t=world[ty][tx];
      if(t===0){
        if(tileWaterCnt[ty*WCOLS+tx]>0) drawWaterTile(sx,sy,tx,ty);
        else drawGroundTile(sx,sy,tx,ty);
      } else drawBoundaryBase(sx,sy,tx,ty);
    }
    drawBridge();
    octx = saved; camX=sx0; camY=sy0;
    baking = false;
    groundOK = true;
  }catch(e){
    groundOK = false;
  }
}

function render(){
  octx.clearRect(0,0,VW,VH);
  octx.fillStyle='#7db25a'; octx.fillRect(0,0,VW,VH);

  {
    const gx0=Math.max(0,Math.floor(camX/TILE)), gx1=Math.min(WCOLS,Math.ceil((camX+VW)/TILE));
    const gy0=Math.max(0,Math.floor(camY/TILE)), gy1=Math.min(WROWS,Math.ceil((camY+VH)/TILE));
    for(let ty=gy0; ty<gy1; ty++) for(let tx=gx0; tx<gx1; tx++){
      const sx=tx*TILE-camX, sy=ty*TILE-camY, t=world[ty][tx];
      if(t===0){ if(tileWaterCnt[ty*WCOLS+tx]>0) drawWaterTile(sx,sy,tx,ty); else drawGroundTile(sx,sy,tx,ty); }
      else drawBoundaryBase(sx,sy,tx,ty);
    }
    drawBridge();
  }
  drawAmbient();
  const ds=[];
  for(const b of BUILDINGS) ds.push({bottom:b.y+b.h, draw:()=>drawHouse(b)});
  for(const p of PROPS) ds.push({bottom:p.y, draw:()=>drawProp(p)});
  ds.push({bottom:NPC.y, draw:drawNPC});
  ds.sort((a,b)=>a.bottom-b.bottom);
  for(const d of ds){ if(d.bottom<=player.y) d.draw(); }
  drawHero();
  for(const d of ds){ if(d.bottom>player.y) d.draw(); }
  drawHUD();
  const ft=fpsVal+' FPS';
  drawText(ft, 4, 34, '#4ade80');
  if(gtime - saveMsgT < 1.3){
    octx.globalAlpha = Math.max(0, 1-(gtime-saveMsgT)/1.3);
    drawText('OK', 4, 44, '#4ade80');
    octx.globalAlpha = 1;
  }
  drawMini();
  if(state==='city'){ if(equipHudOn) drawEquipHUD(); drawJoystick(); }

  ctx.fillStyle='#05070d'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.drawImage(off, oxCss, oyCss, VW*cssScale, VH*cssScale);
}

let fpsFrames=0, fpsLast=0, fpsVal=0;
function frame(now){
  const dt=Math.min((now-last)/1000,0.05); last=now;
  gtime += dt;
  try{
    if(state==='city' && !paused) update(dt);
    render();
  }catch(e){}
  fpsFrames++;
  if(now-fpsLast>=500){
    fpsVal = Math.round(fpsFrames*1000/(now-fpsLast));
    fpsFrames=0; fpsLast=now;
  }
  requestAnimationFrame(frame);
}

let actx=null, master=null, noteBus=null, sfxGain=null, musicOn=true, sfxOn=true, schedStarted=false;
let musicVol=0.6, sfxVol=0.7, noiseBuf=null, lastStep=-1;

const BPM=72, BEAT=60/BPM;

function initAudio(){
  if(actx) return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  actx=new AC();
  master=actx.createGain(); master.gain.value=musicOn?musicVol*0.8:0; master.connect(actx.destination);
  sfxGain=actx.createGain(); sfxGain.gain.value=sfxOn?sfxVol*0.9:0; sfxGain.connect(actx.destination);
  const nlen=Math.floor(actx.sampleRate*0.2);
  noiseBuf=actx.createBuffer(1,nlen,actx.sampleRate);
  const nd=noiseBuf.getChannelData(0);
  for(let i=0;i<nlen;i++) nd[i]=Math.random()*2-1;
  const lp=actx.createBiquadFilter();
  lp.type='lowpass'; lp.frequency.value=1500; lp.Q.value=0.2; lp.connect(master);
  noteBus=actx.createGain(); noteBus.gain.value=0.5; noteBus.connect(lp);
  const delay=actx.createDelay(1.0); delay.delayTime.value=0.36;
  const fb=actx.createGain(); fb.gain.value=0.28;
  const wet=actx.createGain(); wet.gain.value=0.22;
  delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(master);
  const send=actx.createGain(); send.gain.value=0.35;
  noteBus.connect(send); send.connect(delay);
}
function note(freq, t, dur, type, vol, atk, rel){
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur+rel);
  o.connect(g); g.connect(noteBus);
  o.start(t); o.stop(t+dur+rel+0.05);
}
const BARS=[
  {chord:[261.63,329.63,392.00,493.88], bass:130.81},
  {chord:[220.00,261.63,329.63,392.00], bass:110.00},
  {chord:[174.61,220.00,261.63,329.63], bass:87.31},
  {chord:[196.00,246.94,293.66,392.00], bass:98.00},
];
const PENTA=[523.25,587.33,659.25,783.99,880.00];
function scheduleBeat(bi, t){
  const bar=Math.floor(bi/4)%BARS.length, b=bi%4;
  if(b===0){
    for(const f of BARS[bar].chord) note(f, t, BEAT*4*0.9, 'sine', 0.05, 0.8, 1.4);
    note(BARS[bar].bass, t, BEAT*4*0.85, 'sine', 0.09, 0.5, 1.2);
  }
  if((b===2 && Math.random()<0.55) || (b===3 && Math.random()<0.22)){
    note(PENTA[Math.floor(Math.random()*PENTA.length)], t, BEAT*1.1, 'triangle', 0.03, 0.15, 0.9);
  }
}
function scheduler(){
  if(!actx) return;
  while(nextTime < actx.currentTime + 0.4){ scheduleBeat(beatIndex, nextTime); nextTime+=BEAT; beatIndex++; }
}
function startMusic(){
  if(!actx) return;
  if(actx.state==='suspended') actx.resume();
  if(!schedStarted){ schedStarted=true; nextTime=actx.currentTime+0.1; beatIndex=0; setInterval(scheduler,120); }
}
function playStep(){
  if(!actx || !sfxOn || !noiseBuf) return;
  const t=actx.currentTime;
  const src=actx.createBufferSource(); src.buffer=noiseBuf;
  const lp=actx.createBiquadFilter(); lp.type='lowpass';
  lp.frequency.value=1100+Math.random()*300; lp.Q.value=0.5;
  const g=actx.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.07, t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.14);
  src.connect(lp); lp.connect(g); g.connect(sfxGain);
  src.start(t); src.stop(t+0.16);
}
let mutedAll=false, vibOn=true, vibPower=100;
const VIB={1:10, 2:20, 3:34};
function vibrate(level){
  if(!vibOn || vibPower<=0) return;
  const ms=Math.round((VIB[level]||10)*(vibPower/100));
  try{ if(ms>0 && navigator.vibrate) navigator.vibrate(ms); }catch(e){}
}
function sfxDrop(){
  if(!actx||!sfxOn||mutedAll) return;
  const t=actx.currentTime;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(1250,t);
  o.frequency.exponentialRampToValueAtTime(380,t+0.09);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.24,t+0.005);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.13);
  o.connect(g); g.connect(sfxGain);
  o.start(t); o.stop(t+0.15);
}
function sfxBeep(){
  if(!actx||!sfxOn||mutedAll) return;
  const t=actx.currentTime;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='square';
  o.frequency.setValueAtTime(900,t);
  o.frequency.setValueAtTime(1340,t+0.045);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.11,t+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.1);
  o.connect(g); g.connect(sfxGain);
  o.start(t); o.stop(t+0.12);
}
function applyMusic(){ if(actx&&master) master.gain.setTargetAtTime((musicOn&&!mutedAll)?musicVol*0.8:0, actx.currentTime, 0.05); }
function applySfx(){ if(actx&&sfxGain) sfxGain.gain.setTargetAtTime((sfxOn&&!mutedAll)?sfxVol*0.9:0, actx.currentTime, 0.05); }

const SAVE_KEY='xingchen_huixiang_save_v1';

const SAVE_VER=1;

function collectSave(){
  return { sig:SAVE_SIG, ver:SAVE_VER, at:Date.now(),
    p:{ x:player.x, y:player.y, hp:player.hp, maxHp:player.maxHp, speed:player.speed },
    lv:level, xp:xp, need:xpNeed,
    bag:bagItems.slice(),
    eq:{ weapons:EQUIP.weapons.slice(), armors:EQUIP.armors.slice(), accessories:EQUIP.accessories.slice() } };
}
function applySave(s){
  if(!s || s.sig!==SAVE_SIG) return false;
  const p=player;
  if(s.p){ p.x=s.p.x; p.y=s.p.y; p.hp=s.p.hp; p.maxHp=s.p.maxHp; p.speed=s.p.speed||80; }
  if(!isFinite(p.x)||!isFinite(p.y)||solidAt(p.x,p.y)){ p.x=680; p.y=448; }
  level=s.lv||0; xp=s.xp||0; xpNeed=s.need||10;
  if(Array.isArray(s.bag)) bagItems=s.bag.filter(id=>ITEMS[id]);
  if(s.eq){
    if(Array.isArray(s.eq.weapons)) EQUIP.weapons=s.eq.weapons.slice(0,3);
    if(Array.isArray(s.eq.armors)) EQUIP.armors=s.eq.armors.slice(0,3);
    if(Array.isArray(s.eq.accessories)) EQUIP.accessories=s.eq.accessories.slice(0,6);
  }
  camXs=Math.max(0,Math.min(WORLD_W-VW, p.x-VW/2));
  camYs=Math.max(0,Math.min(WORLD_H-VH, p.y-VH/2));
  camX=Math.round(camXs*RES)/RES; camY=Math.round(camYs*RES)/RES;
  return true;
}
function saveGame(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(collectSave())); }catch(e){}
  if(typeof saveMsgT!=='undefined') saveMsgT=gtime;
}
function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    return applySave(JSON.parse(raw));
  }catch(e){ return false; }
}
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function downloadSave(){
  const blob=new Blob([JSON.stringify(collectSave())],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='星辰回响-存档-'+new Date().toISOString().slice(0,10)+'.star';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function readSaveFile(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      if(applySave(JSON.parse(r.result))){ saveGame(); alert('存档导入成功'); }
      else alert('这不是有效的「星辰回响」存档');
    }catch(e){ alert('存档文件损坏或格式不对'); }
  };
  r.readAsText(file);
}
function makeSaveCode(){ return btoa(unescape(encodeURIComponent(JSON.stringify(collectSave())))); }
function useSaveCode(code){
  try{ return applySave(JSON.parse(decodeURIComponent(escape(atob(code.trim()))))); }
  catch(e){ return false; }
}

function equipLayout(){
  const pad=3, labelH=7, gap=6, swordS=18;
  const WS=22, Wgap=4, weaponW=3*WS+2*Wgap;
  const GW=weaponW+pad*2, GH=labelH+WS+pad*2;
  const AS=12, Agap=3, armorW=3*AS+2*Agap;
  const GA=armorW+pad*2, GAH=labelH+AS+pad*2;
  const SS=10, Sgap=2, accW=3*SS+2*Sgap, accH=2*SS+Sgap;
  const GS=accW+pad*2, GSH=labelH+accH+pad*2;
  const totalW=GA+gap+GW+gap+GS+gap+swordS;
  const x0=Math.round(VW/2-totalW/2), bottom=VH-5;
  const hudBox={x0:x0-4, y0:Math.min(bottom-GAH,bottom-GH,bottom-GSH)-4, x1:x0+totalW+4, y1:bottom+4};
  return {
    pad,labelH,gap,swordS,WS,AS,SS,GW,GH,GA,GAH,GS,GSH,
    ax:x0, ay:bottom-GAH,
    wx:x0+GA+gap, wy:bottom-GH,
    sx:x0+GA+gap+GW+gap, sy:bottom-GSH,
    swx:x0+GA+gap+GW+gap+GS+gap, swy:bottom-swordS, hudBox
  };
}

function bindItemSlot(el, onTap, onLong){
  let timer=null, longFired=false;
  const start=(e)=>{
    if(e.cancelable) e.preventDefault();
    longFired=false;
    if(timer) clearTimeout(timer);
    timer=setTimeout(()=>{ timer=null; longFired=true; onLong(); }, 450);
  };
  const finish=()=>{ if(timer){ clearTimeout(timer); timer=null; if(!longFired){ sfxBeep(); vibrate(2); onTap(); } } };
  const cancel=()=>{ if(timer){ clearTimeout(timer); timer=null; } };
  el.addEventListener('touchstart', start, {passive:false});
  el.addEventListener('touchend', finish);
  el.addEventListener('touchmove', cancel);
  el.addEventListener('touchcancel', cancel);
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', finish);
  el.addEventListener('mouseleave', cancel);
}

                    : {left:innerWidth/2, top:innerHeight/2, right:innerWidth/2, bottom:innerHeight/2};
  const br = box.getBoundingClientRect();
  let x = ar.right + 8, y = ar.top;

function makePixLabel(text, px, color){
  const c=document.createElement('canvas');
  const g=c.getContext('2d');
  g.font=px+'px monospace';
  const w=Math.ceil(g.measureText(text).width)+4;
  const h=px+4;
  c.width=w; c.height=h;
  g.font=px+'px monospace'; g.textBaseline='top'; g.fillStyle='#ffffff';
  g.fillText(text,2,2);
  try{
    const img=g.getImageData(0,0,w,h), d=img.data;
    for(let i=0;i<d.length;i+=4) d[i+3]=d[i+3]>55?255:0;
    g.putImageData(img,0,0);
    g.globalCompositeOperation='source-in';
    g.fillStyle=color; g.fillRect(0,0,w,h);
    g.globalCompositeOperation='source-over';
  }catch(e){}
  c.style.width=w+'px'; c.style.height=h+'px';
  c.style.imageRendering='pixelated';
  return c;
}
function setPixLabel(id, text, px, color){
  const el=document.getElementById(id);
  if(!el||el.childElementCount) return;
  el.appendChild(makePixLabel(text, px, color));
}

function sfxEquip(){
  if(!actx||!sfxOn||mutedAll) return;
  const t=actx.currentTime;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='triangle';
  o.frequency.setValueAtTime(660,t); o.frequency.setValueAtTime(990,t+0.05);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.14,t+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
  o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t+0.18);
}
const miniCanvas=document.createElement('canvas');
miniCanvas.width=WCOLS; miniCanvas.height=WROWS;
const mctx=miniCanvas.getContext('2d');
function buildMini(){
  for(let y=0;y<WROWS;y++) for(let x=0;x<WCOLS;x++){
    const t=world[y][x];
    let c;
    if(t!==0) c='#6f7784';
    else if(tileWaterCnt[y*WCOLS+x]>0) c='#2f6fb0';
    else if(tileRoadCnt[y*WCOLS+x]>0) c='#c9a96b';
    else c='#5f8f46';
    mctx.fillStyle=c; mctx.fillRect(x,y,1,1);
  }
  for(const b of BUILDINGS){ mctx.fillStyle='#e0b070';
    mctx.fillRect(Math.round(b.x/TILE), Math.round(b.y/TILE), Math.max(1,Math.round(b.w/TILE)), Math.max(1,Math.round(b.h/TILE))); }
}
function drawAmbient(){
  const gx0=Math.max(0,Math.floor(camX/TILE)), gx1=Math.min(WCOLS,Math.ceil((camX+VW)/TILE));
  const gy0=Math.max(0,Math.floor(camY/TILE)), gy1=Math.min(WROWS,Math.ceil((camY+VH)/TILE));
  for(let ty=gy0; ty<gy1; ty++) for(let tx=gx0; tx<gx1; tx++){
    if(tileWaterCnt[ty*WCOLS+tx]>20){
      const sx=tx*TILE-camX, sy=ty*TILE-camY;
      const ph=Math.sin(gtime*2+tx*0.7+ty*1.3);
      px(sx+3+ph*3, sy+5, 3,1,'#4a8fd4');
      px(sx+9-ph*2, sy+11, 2,1,'#5fa8e6');
    }
  }
  if(nearNpc){
    const bx=Math.round(NPC.x-camX), by=Math.round(NPC.y-camY);
    octx.strokeStyle='#ffffff'; octx.lineWidth=1;
    octx.strokeRect(bx-8, by-14, 17, 25);
    px(bx-4, by-30, 9, 12, '#0b0f1a');
    px(bx-3, by-29, 7, 10, '#f5c542');
    px(bx, by-27, 1, 5, '#0b0f1a');
    px(bx, by-21, 1, 1, '#0b0f1a');
  }
  for(let i=0;i<14;i++){
    const fx=hash(i,7)*WORLD_W + Math.sin(gtime*0.15+i)*30;
    const fy=hash(i,13)*WORLD_H + Math.cos(gtime*0.12+i*1.7)*24;
    const x=fx-camX, y=fy-camY;
    if(x>-4&&x<VW+4&&y>-4&&y<VH+4){
      octx.globalAlpha=0.35+0.45*Math.abs(Math.sin(gtime*1.5+i));
      px(x,y,1,1,'#fde68a');
      octx.globalAlpha=1;
    }
  }

}

buildMini(); resetGame(); hasSave=loadGame(); syncBagBtn(); last=performance.now(); fpsLast=performance.now(); requestAnimationFrame(frame);
