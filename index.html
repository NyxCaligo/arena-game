<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>阿尔法大陆</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05070d; }
  body { font-family:"Courier New",monospace; color:#e2e8f0;
         touch-action:none; user-select:none; -webkit-user-select:none; }
  #cv { position:fixed; inset:0; display:block; touch-action:none; }
  .ov { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
        justify-content:center; gap:18px; background:rgba(5,7,13,.94); text-align:center; padding:24px; z-index:5; }
  .ov.hidden { display:none; }
  #menu .title { font-size:34px; font-weight:bold; color:#f8fafc; letter-spacing:5px;
                 text-shadow:3px 3px 0 #0284c7, 6px 6px 0 #000; }
  #menu .sub { color:#475569; letter-spacing:7px; font-size:12px; margin-top:-8px; }
  #subtitle .text { font-size:28px; font-weight:bold; color:#f8fafc; letter-spacing:4px;
                    text-shadow:3px 3px 0 #000; }
  button { font-family:"Courier New",monospace; font-weight:bold; font-size:17px;
           background:#4ade80; color:#052e16; border:2px solid #052e16; border-radius:0;
           box-shadow:0 4px 0 #052e16; padding:13px 34px; cursor:pointer; }
  button:active { transform:translateY(3px); box-shadow:0 1px 0 #052e16; }
  #settingsBtn { position:fixed; z-index:6;
           top:calc(10px + env(safe-area-inset-top, 0px));
           right:calc(12px + env(safe-area-inset-right, 0px));
           width:44px; height:44px; padding:0;
           background:#9aa3ae; color:#1e293b; border:2px solid #4b5462; border-radius:6px;
           font-size:20px; box-shadow:none;
           display:flex; align-items:center; justify-content:center; }
  #settingsBtn:active { transform:translateY(2px); }
  #settingsBackdrop { position:fixed; inset:0; z-index:7; background:rgba(0,0,0,.45); }
  #settingsBackdrop.hidden, #settingsPanel.hidden { display:none; }
  #settingsPanel { position:fixed; z-index:8; top:0; right:0; bottom:0;
           width:min(300px, 74vw); background:#0d1524; border-left:2px solid #1e293b;
           padding:calc(14px + env(safe-area-inset-top, 0px)) 16px 18px;
           display:flex; flex-direction:column; gap:18px; }
  .sp-title { font-size:18px; font-weight:bold; letter-spacing:2px; color:#f8fafc;
              display:flex; justify-content:space-between; align-items:center; }
  .sp-close { background:none; border:none; box-shadow:none; padding:0 6px; color:#94a3b8; font-size:24px; }
  .sp-group { display:flex; flex-direction:column; gap:8px; }
  .sp-label { font-size:14px; color:#cbd5e1; }
  .sp-row { display:flex; align-items:center; gap:10px; }
  .sp-toggle { width:50px; padding:7px 0; font-size:13px; background:#475569; color:#e2e8f0;
               border:2px solid #1e293b; box-shadow:0 2px 0 #1e293b; }
  .sp-toggle.on { background:#4ade80; color:#052e16; border-color:#052e16; }
  input[type=range] { flex:1; accent-color:#4ade80; }
  .sp-full { width:100%; background:#3b82f6; color:#eff6ff; border:2px solid #1e3a8a; box-shadow:0 3px 0 #1e3a8a; }
  #rotate { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center;
            justify-content:center; gap:18px; background:#05070d; color:#e2e8f0; text-align:center; padding:24px; }
  #rotate.hidden { display:none; }
  #rotate .icon { font-size:56px; animation:rot 2.4s ease-in-out infinite; }
  #rotate .t { font-size:20px; font-weight:bold; letter-spacing:2px; }
  #rotate .d { color:#64748b; font-size:13px; }
  @keyframes rot { 0%,100%{transform:rotate(0)} 50%{transform:rotate(90deg)} }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="settingsBtn">⚙</button>
<div id="settingsBackdrop" class="hidden"></div>
<div id="settingsPanel" class="hidden">
  <div class="sp-title">设置<button id="settingsClose" class="sp-close">×</button></div>
  <div class="sp-group">
    <div class="sp-label">音乐</div>
    <div class="sp-row">
      <button id="musicToggle" class="sp-toggle on">开</button>
      <input type="range" id="musicVol" min="0" max="100" value="60">
    </div>
  </div>
  <div class="sp-group">
    <div class="sp-label">音效</div>
    <div class="sp-row">
      <button id="sfxToggle" class="sp-toggle on">开</button>
      <input type="range" id="sfxVol" min="0" max="100" value="70">
    </div>
  </div>
  <button id="fullscreenBtn" class="sp-full">全屏</button>
</div>

<div id="menu" class="ov">
  <div class="title">阿尔法大陆</div>
  <div class="sub">ALPHA LAND</div>
  <button id="startBtn">开始游戏</button>
</div>
<div id="subtitle" class="ov hidden">
  <div class="text">到达主城</div>
</div>
<div id="rotate" class="hidden">
  <div class="icon">📱</div>
  <div class="t">请把手机横过来</div>
  <div class="d">横屏游玩体验更好</div>
</div>

<script>
"use strict";
const VW=352, VH=176, TILE=16, WCOLS=44, WROWS=30;
const WORLD_W=WCOLS*TILE, WORLD_H=WROWS*TILE;
const JBX=VW*0.2, JBY=VH*0.8, JR=26;   // 常驻摇杆位置（左下）
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const off = document.createElement('canvas'); off.width=VW; off.height=VH;
const octx = off.getContext('2d'); octx.imageSmoothingEnabled=false;

let cssScale=1, oxCss=0, oyCss=0;
function resize(){
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  cssScale = Math.min(cv.width/VW, cv.height/VH);
  oxCss = (cv.width - VW*cssScale)/2;
  oyCss = (cv.height - VH*cssScale)/2;
  ctx.imageSmoothingEnabled = false;
}
resize();
window.addEventListener('resize', resize);

// ---------- 确定性随机 ----------
function hash(x,y){
  let h = (x|0)*374761393 + (y|0)*668265263;
  h = (h ^ (h>>>13)) * 1274126177;
  return ((h ^ (h>>>16)) >>> 0) / 4294967295;
}

// ---------- 世界生成 ----------
// 0 草地  2 边界丘陵
const world = [];
for(let y=0;y<WROWS;y++){
  const row=[];
  for(let x=0;x<WCOLS;x++){
    const edge=Math.min(x,y,WCOLS-1-x,WROWS-1-y);
    row.push(edge<3?2:0);
  }
  world.push(row);
}

// ---------- 边界装饰（大小/种类不一的丘陵、树、灌木、草、花、石） ----------
const borderDeco = [];
(()=>{
  for(let y=0;y<WROWS;y++) for(let x=0;x<WCOLS;x++){
    if(world[y][x]!==2) continue;
    if(hash(x*7+1,y*11+3) < 0.22) continue;
    const jx=(hash(x+9,y+4)-0.5)*TILE*0.8;
    const jy=(hash(x+2,y+8)-0.5)*TILE*0.8;
    const s=0.6+hash(x+5,y+7)*1.0;
    const t=hash(x+3,y+9);
    let type;
    if(t<0.28) type='tree';
    else if(t<0.40) type='pine';
    else if(t<0.58) type='mound';
    else if(t<0.72) type='bush';
    else if(t<0.84) type='grass';
    else if(t<0.93) type='flower';
    else type='rock';
    borderDeco.push({type, x:x*TILE+TILE/2+jx, y:y*TILE+TILE/2+jy, s, v:hash(x+1,y+2)});
  }
})();

// ---------- 状态 ----------
let state='menu', last=0;
let camX=0, camY=0, walkPhase=0;
let player = { x:360, y:248, hp:100, maxHp:100, r:6, speed:80, face:1 };
let level=0, xp=0, xpNeed=10;

function resetGame(){
  player = { x:360, y:248, hp:100, maxHp:100, r:6, speed:80, face:1 };
  level=0; xp=0; xpNeed=10; walkPhase=0; lastStep=-1;
  camX=player.x-VW/2; camY=player.y-VH/2;
}

// ---------- 输入（常驻摇杆，仅右下角 1/4 可操作） ----------
let joy={active:false, dx:0, dy:0};
function toV(x,y){ return [(x-oxCss)/cssScale, (y-oyCss)/cssScale]; }
function joyMove(vx,vy){
  const dx=vx-JBX, dy=vy-JBY, d=Math.hypot(dx,dy), m=d>JR?JR/d:1;
  joy.dx=dx*m; joy.dy=dy*m;
}
cv.addEventListener('touchstart', e=>{
  if(state!=='city') return;
  const t=e.touches[0]; const [vx,vy]=toV(t.clientX,t.clientY);
  if(vx < VW*0.5 && vy > VH*0.5){ joy.active=true; joyMove(vx,vy); }
}, {passive:true});
cv.addEventListener('touchmove', e=>{
  if(!joy.active) return;
  const t=e.touches[0]; const [vx,vy]=toV(t.clientX,t.clientY);
  joyMove(vx,vy);
}, {passive:true});
cv.addEventListener('touchend', ()=>{ joy.active=false; joy.dx=joy.dy=0; }, {passive:true});
cv.addEventListener('touchcancel', ()=>{ joy.active=false; joy.dx=joy.dy=0; }, {passive:true});
cv.addEventListener('mousedown', e=>{
  if(state!=='city')return; const [vx,vy]=toV(e.clientX,e.clientY);
  if(vx<VW*0.5 && vy>VH*0.5){ joy.active=true; joyMove(vx,vy); }
});
cv.addEventListener('mousemove', e=>{ if(!joy.active)return; const [vx,vy]=toV(e.clientX,e.clientY); joyMove(vx,vy); });
cv.addEventListener('mouseup', ()=>{ joy.active=false; joy.dx=joy.dy=0; });

// ---------- 碰撞 ----------
function solidAt(px,py){
  const tx=Math.floor(px/TILE), ty=Math.floor(py/TILE);
  if(tx<0||ty<0||tx>=WCOLS||ty>=WROWS) return true;
  return world[ty][tx]!==0;
}
function tryMove(dx,dy){
  const half=5, nx=player.x+dx, ny=player.y+dy;
  const ok=(x,y)=> !solidAt(x-half,y-half)&&!solidAt(x+half,y-half)&&!solidAt(x-half,y+half)&&!solidAt(x+half,y+half);
  if(ok(nx,ny)){ player.x=nx; player.y=ny; return; }
  if(ok(nx,player.y)) player.x=nx;
  if(ok(player.x,ny)) player.y=ny;
}

function update(dt){
  if(joy.active){
    const d=Math.hypot(joy.dx,joy.dy);
    if(d>2){
      tryMove(joy.dx/d*player.speed*dt, joy.dy/d*player.speed*dt);
      walkPhase += dt*16;
      const si=Math.floor(walkPhase/Math.PI);
      if(si!==lastStep){ lastStep=si; playStep(); }
      if(joy.dx>2) player.face=1; else if(joy.dx<-2) player.face=-1;
    }
  }
  if(!(joy.active && Math.hypot(joy.dx,joy.dy)>2)) walkPhase = 0;
  camX = Math.max(0, Math.min(WORLD_W-VW, player.x-VW/2));
  camY = Math.max(0, Math.min(WORLD_H-VH, player.y-VH/2));
}

// ---------- 像素字体 ----------
const FONT = {
  '0':["111","101","101","101","111"], '1':["010","110","010","010","111"],
  '2':["111","001","111","100","111"], '3':["111","001","111","001","111"],
  '4':["101","101","111","001","001"], '5':["111","100","111","001","111"],
  '6':["111","100","111","101","111"], '7':["111","001","010","010","010"],
  '8':["111","101","111","101","111"], '9':["111","101","111","001","111"],
  'L':["100","100","100","100","111"], 'V':["101","101","101","101","010"],
};
const IC = { heart:[".1.1.","11111","11111",".111.","..1.."] };
function drawText(str, x, y, color, s=1){
  octx.fillStyle=color; let cx=x;
  for(let i=0;i<str.length;i++){
    const g=FONT[str[i]]||FONT['0'];
    for(let ry=0;ry<5;ry++) for(let rx=0;rx<3;rx++)
      if(g[ry][rx]==='1') octx.fillRect(cx+rx*s, y+ry*s, s, s);
    cx+=4*s;
  }
}
function drawIcon(icon, x, y, color, s=1){
  octx.fillStyle=color;
  for(let ry=0;ry<icon.length;ry++) for(let rx=0;rx<icon[ry].length;rx++)
    if(icon[ry][rx]!=='.') octx.fillRect(x+rx*s, y+ry*s, s, s);
}
function drawBar(x,y,w,h,frac,color){
  octx.fillStyle='#0b0f1a'; octx.fillRect(x-1,y-1,w+2,h+2);
  octx.fillStyle='#2b3444'; octx.fillRect(x,y,w,h);
  const fw=Math.max(0,Math.min(w,Math.round(w*frac)));
  if(fw>0){ octx.fillStyle=color; octx.fillRect(x,y,fw,h); }
}

// ---------- 绘制 ----------
function px(x,y,w,h,c){ octx.fillStyle=c; octx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
function fillCircle(x,y,r,c){ octx.fillStyle=c; octx.beginPath(); octx.arc(x,y,r,0,7); octx.fill(); }

function drawGrass(sx,sy,tx,ty){
  const h=hash(tx,ty);
  if(h<0.2){ octx.fillStyle='#74a852'; octx.fillRect(sx,sy,TILE,TILE); }
  else if(h>0.55 && h<0.65){ octx.fillStyle='#88bf66'; octx.fillRect(sx,sy,TILE,TILE); }
  for(let i=0;i<3;i++){
    const bx=sx+Math.floor(hash(tx*7+i,ty*13+i)*(TILE-2));
    const by=sy+Math.floor(hash(tx*3+i,ty*5+i)*(TILE-3));
    px(bx,by,1,2,'#639a45');
  }
  if(h>0.92){
    const fx=sx+4+Math.floor(hash(tx,ty)*6), fy=sy+4+Math.floor(hash(ty,tx)*6);
    px(fx,fy,2,2,'#fde047'); px(fx+1,fy+1,1,1,'#f59e0b');
  } else if(h<0.05){
    px(sx+5,sy+8,4,3,'#9aa5b1'); px(sx+6,sy+7,2,1,'#b4bec8');
  } else if(h>0.82 && h<0.86){
    px(sx+9,sy+10,5,4,'#4e7d36'); px(sx+10,sy+9,3,2,'#5f9440');
  }
}
function drawBoundaryBase(sx,sy,tx,ty){
  const h=hash(tx*3+1,ty*7+5);
  // 一大块石砖（一个格子一块）
  octx.fillStyle = h<0.5 ? '#8a919c' : '#828994';
  octx.fillRect(sx,sy,TILE,TILE);
  // 左上高光 / 右下阴影，做出立体大石块
  octx.fillStyle='#a9b0bb';
  octx.fillRect(sx,sy,TILE,2);
  octx.fillRect(sx,sy,2,TILE);
  octx.fillStyle='#666d78';
  octx.fillRect(sx,sy+TILE-2,TILE,2);
  octx.fillRect(sx+TILE-2,sy,2,TILE);
  // 石面纹理
  if(h>0.6) px(sx+4,sy+5,4,2,'#949ba6');
  if(h<0.4) px(sx+9,sy+10,4,2,'#737a85');
}
function drawBorderDeco(d){
  const sx=d.x-camX, sy=d.y-camY;
  if(sx<-60||sx>VW+60||sy<-80||sy>VH+70) return;
  const k=d.s, v=d.v;
  if(d.type==='tree'){
    px(sx-2*k, sy+3*k, 4*k, 10*k, '#5b3a1e');
    fillCircle(sx, sy-3*k, 9*k, v<0.5?'#2f4a26':'#356028');
    fillCircle(sx-3*k, sy-5*k, 6*k, '#3a5c2e');
    fillCircle(sx+3*k, sy-4*k, 5*k, '#446e34');
  } else if(d.type==='pine'){
    px(sx-1.5*k, sy+4*k, 3*k, 8*k, '#5b3a1e');
    octx.fillStyle='#2d5230';
    octx.beginPath(); octx.moveTo(sx, sy-14*k); octx.lineTo(sx+8*k, sy+4*k); octx.lineTo(sx-8*k, sy+4*k); octx.closePath(); octx.fill();
    octx.fillStyle='#3a6a38';
    octx.beginPath(); octx.moveTo(sx, sy-14*k); octx.lineTo(sx+5*k, sy-3*k); octx.lineTo(sx-5*k, sy-3*k); octx.closePath(); octx.fill();
  } else if(d.type==='mound'){
    fillCircle(sx-2*k, sy+2*k, 10*k, '#6b5135');
    fillCircle(sx+3*k, sy+3*k, 8*k, '#7a5f3d');
    fillCircle(sx, sy-2*k, 7*k, '#8a6b47');
    fillCircle(sx-1*k, sy-4*k, 4*k, '#9c7a52');
    px(sx-4*k, sy-7*k, 1, 5*k, '#79a957');
    px(sx+4*k, sy-8*k, 1, 6*k, '#639a45');
    if(v>0.6) px(sx+1*k, sy-9*k, 2, 2, '#fde047');
  } else if(d.type==='bush'){
    fillCircle(sx, sy, 8*k, '#3a6a2c');
    fillCircle(sx-3*k, sy-3*k, 5*k, '#4e8538');
    fillCircle(sx+4*k, sy-2*k, 4*k, '#5f9440');
    if(v>0.7) px(sx+1*k, sy-6*k, 2, 2, '#f87171');
  } else if(d.type==='grass'){
    for(let i=0;i<4;i++) px(sx-6*k+i*4*k, sy-5*k, 1, 6*k, i%2?'#5f9440':'#6aa34a');
  } else if(d.type==='flower'){
    fillCircle(sx, sy+1*k, 8*k, '#4e8538');
    px(sx-4*k, sy-3*k, 2, 2, '#f472b6');
    px(sx+1*k, sy-5*k, 2, 2, '#fde047');
    px(sx+5*k, sy-2*k, 2, 2, '#f87171');
    px(sx-1*k, sy-4*k, 1, 1, '#ffffff');
  } else { // rock
    fillCircle(sx, sy, 6*k, '#7b8492');
    fillCircle(sx-2*k, sy-2*k, 4*k, '#98a1ae');
    fillCircle(sx+2*k, sy+1*k, 3*k, '#5f6773');
  }
}

// ---------- 主角：椭圆头身连体 + 红帽子 ----------
function drawHero(){
  const cx=player.x-camX, cy=player.y-camY;
  octx.fillStyle='rgba(0,0,0,.28)';
  octx.beginPath(); octx.ellipse(cx, cy+8, 5, 2, 0, 0, 7); octx.fill();

  const moving = joy.active && (Math.abs(joy.dx)+Math.abs(joy.dy))>2;
  const sw = moving ? Math.sin(walkPhase)*2.0 : 0;
  const ab = moving ? Math.sin(walkPhase)*1.3 : 0;
  const bounce = moving ? Math.abs(Math.sin(walkPhase))*1.4 : 0;

  octx.save();
  octx.translate(cx, cy - bounce);
  if(player.face<0) octx.scale(-1,1);

  // 红色披风内衬（身后，略窄）
  px(-4, -5, 9, 9, '#6d1a1a');

  // 腿（更细）
  px(-2+sw, 4, 2, 4, '#17171a');
  px(0.5-sw, 4, 2, 4, '#17171a');
  // 鞋
  px(-2.5+sw, 7, 3, 2, '#050507');
  px(0.5-sw, 7, 3, 2, '#050507');

  // 身体（收窄）
  px(-3, -4, 7, 8, '#141416');
  px(-3, -4, 7, 1, '#2a2a30');
  // 红领带
  px(0, -3, 1, 5, '#b91c1c');
  px(-1, -3, 3, 1, '#b91c1c');
  // 金扣
  px(1, -1, 1, 1, '#d4b24a');
  px(1, 1, 1, 1, '#d4b24a');

  // 手臂（贴紧身体）
  px(-5, -4-ab, 2, 4, '#141416');
  px(4, -4+ab, 2, 4, '#141416');
  px(-5, 0-ab, 2, 2, '#08080a');
  px(4, 0+ab, 2, 2, '#08080a');

  // 头（缩小）
  px(-2, -8, 5, 4, '#f0c9a0');
  // 金瞳
  px(-2, -7, 2, 2, '#f2c23c');
  px(1, -7, 2, 2, '#f2c23c');

  // 头发（更多、更蓬）
  px(-3, -10, 7, 2, '#191919');
  px(-4, -9, 2, 4, '#191919');
  px(3, -9, 2, 4, '#191919');
  px(-3, -11, 2, 1, '#191919');
  px(1, -11, 2, 1, '#191919');
  px(-1, -12, 1, 2, '#191919');
  px(2, -12, 1, 2, '#191919');
  // 红色挑染
  px(2, -10, 2, 3, '#de2b2b');

  octx.restore();
}

function drawHUD(){
  drawIcon(IC.heart, 4, 4, '#f43f5e');
  drawBar(11, 5, 64, 7, player.hp/player.maxHp, '#fb7185');
  drawText(String(Math.max(0,Math.ceil(player.hp))), 11, 14, '#f8fafc');
  drawText('LV', 4, 23, '#a5b4fc');
  drawText(String(level), 13, 23, '#f8fafc');
  drawBar(26, 24, 49, 4, xp/xpNeed, '#38bdf8');
}

function drawJoystick(){
  // 底盘
  octx.strokeStyle='rgba(20,30,20,.45)'; octx.lineWidth=3;
  octx.beginPath(); octx.arc(JBX,JBY,JR,0,7); octx.stroke();
  octx.fillStyle='rgba(255,255,255,.14)';
  octx.beginPath(); octx.arc(JBX,JBY,JR-3,0,7); octx.fill();
  // 摇杆头
  const kx=JBX+(joy.active?joy.dx:0), ky=JBY+(joy.active?joy.dy:0);
  octx.fillStyle='rgba(255,255,255,.55)';
  octx.beginPath(); octx.arc(kx,ky,9,0,7); octx.fill();
  octx.fillStyle='rgba(0,0,0,.25)';
  octx.beginPath(); octx.arc(kx,ky,9,0,7); octx.stroke();
}

function render(){
  octx.clearRect(0,0,VW,VH);
  octx.fillStyle='#7db25a'; octx.fillRect(0,0,VW,VH);

  const x0=Math.max(0,Math.floor(camX/TILE)), x1=Math.min(WCOLS,Math.ceil((camX+VW)/TILE));
  const y0=Math.max(0,Math.floor(camY/TILE)), y1=Math.min(WROWS,Math.ceil((camY+VH)/TILE));
  for(let ty=y0; ty<y1; ty++) for(let tx=x0; tx<x1; tx++){
    const sx=tx*TILE-camX, sy=ty*TILE-camY, t=world[ty][tx];
    if(t===0) drawGrass(sx,sy,tx,ty);
    else drawBoundaryBase(sx,sy,tx,ty);
  }
  drawHero();
  drawHUD();
  if(state==='city') drawJoystick();

  ctx.fillStyle='#05070d'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.drawImage(off, oxCss, oyCss, VW*cssScale, VH*cssScale);
}

function frame(now){
  const dt=Math.min((now-last)/1000,0.05); last=now;
  if(state==='city') update(dt);
  render();
  requestAnimationFrame(frame);
}

// ---------- 背景音乐（舒缓合成） ----------
let actx=null, master=null, noteBus=null, sfxGain=null, musicOn=true, sfxOn=true, schedStarted=false;
let musicVol=0.6, sfxVol=0.7, noiseBuf=null, lastStep=-1;
let nextTime=0, beatIndex=0;
const BPM=72, BEAT=60/BPM;

function initAudio(){
  if(actx) return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  actx=new AC();
  master=actx.createGain(); master.gain.value=musicOn?musicVol*0.8:0; master.connect(actx.destination);
  sfxGain=actx.createGain(); sfxGain.gain.value=sfxOn?sfxVol*0.9:0; sfxGain.connect(actx.destination);
  const nlen=Math.floor(actx.sampleRate*0.2);
  noiseBuf=actx.createBuffer(1,nlen,actx.sampleRate);
  const nd=noiseBuf.getChannelData(0);
  for(let i=0;i<nlen;i++) nd[i]=Math.random()*2-1;
  const lp=actx.createBiquadFilter();
  lp.type='lowpass'; lp.frequency.value=1500; lp.Q.value=0.2; lp.connect(master);
  noteBus=actx.createGain(); noteBus.gain.value=0.5; noteBus.connect(lp);
  const delay=actx.createDelay(1.0); delay.delayTime.value=0.36;
  const fb=actx.createGain(); fb.gain.value=0.28;
  const wet=actx.createGain(); wet.gain.value=0.22;
  delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(master);
  const send=actx.createGain(); send.gain.value=0.35;
  noteBus.connect(send); send.connect(delay);
}
function note(freq, t, dur, type, vol, atk, rel){
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur+rel);
  o.connect(g); g.connect(noteBus);
  o.start(t); o.stop(t+dur+rel+0.05);
}
const BARS=[
  {chord:[261.63,329.63,392.00,493.88], bass:130.81},
  {chord:[220.00,261.63,329.63,392.00], bass:110.00},
  {chord:[174.61,220.00,261.63,329.63], bass:87.31},
  {chord:[196.00,246.94,293.66,392.00], bass:98.00},
];
const PENTA=[523.25,587.33,659.25,783.99,880.00];
function scheduleBeat(bi, t){
  const bar=Math.floor(bi/4)%BARS.length, b=bi%4;
  if(b===0){
    for(const f of BARS[bar].chord) note(f, t, BEAT*4*0.9, 'sine', 0.05, 0.8, 1.4);
    note(BARS[bar].bass, t, BEAT*4*0.85, 'sine', 0.09, 0.5, 1.2);
  }
  if((b===2 && Math.random()<0.55) || (b===3 && Math.random()<0.22)){
    note(PENTA[Math.floor(Math.random()*PENTA.length)], t, BEAT*1.1, 'triangle', 0.03, 0.15, 0.9);
  }
}
function scheduler(){
  if(!actx) return;
  while(nextTime < actx.currentTime + 0.4){ scheduleBeat(beatIndex, nextTime); nextTime+=BEAT; beatIndex++; }
}
function startMusic(){
  if(!actx) return;
  if(actx.state==='suspended') actx.resume();
  if(!schedStarted){ schedStarted=true; nextTime=actx.currentTime+0.1; beatIndex=0; setInterval(scheduler,120); }
}
function playStep(){
  if(!actx || !sfxOn || !noiseBuf) return;
  const t=actx.currentTime;
  const src=actx.createBufferSource(); src.buffer=noiseBuf;
  const lp=actx.createBiquadFilter(); lp.type='lowpass';
  lp.frequency.value=1100+Math.random()*300; lp.Q.value=0.5;
  const g=actx.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.07, t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.14);
  src.connect(lp); lp.connect(g); g.connect(sfxGain);
  src.start(t); src.stop(t+0.16);
}
function applyMusic(){ if(actx&&master) master.gain.setTargetAtTime(musicOn?musicVol*0.8:0, actx.currentTime, 0.05); }
function applySfx(){ if(actx&&sfxGain) sfxGain.gain.setTargetAtTime(sfxOn?sfxVol*0.9:0, actx.currentTime, 0.05); }
document.addEventListener('visibilitychange', ()=>{
  if(!actx) return;
  if(document.hidden){ actx.suspend(); } else { actx.resume(); }
});

// ---------- 设置面板 ----------
const settingsBtn=document.getElementById('settingsBtn');
const settingsPanel=document.getElementById('settingsPanel');
const settingsBackdrop=document.getElementById('settingsBackdrop');
function openSettings(open){ settingsPanel.classList.toggle('hidden', !open); settingsBackdrop.classList.toggle('hidden', !open); }
settingsBtn.onclick=()=>openSettings(true);
document.getElementById('settingsClose').onclick=()=>openSettings(false);
settingsBackdrop.onclick=()=>openSettings(false);

const musicToggle=document.getElementById('musicToggle');
const sfxToggle=document.getElementById('sfxToggle');
const musicVolEl=document.getElementById('musicVol');
const sfxVolEl=document.getElementById('sfxVol');
musicToggle.onclick=()=>{
  if(!actx){ initAudio(); startMusic(); musicOn=true; }
  else musicOn=!musicOn;
  musicToggle.classList.toggle('on', musicOn);
  musicToggle.textContent=musicOn?'开':'关';
  applyMusic();
};
sfxToggle.onclick=()=>{
  if(!actx){ initAudio(); startMusic(); sfxOn=true; }
  else sfxOn=!sfxOn;
  sfxToggle.classList.toggle('on', sfxOn);
  sfxToggle.textContent=sfxOn?'开':'关';
  applySfx();
};
musicVolEl.oninput=()=>{ musicVol=musicVolEl.value/100; applyMusic(); };
sfxVolEl.oninput=()=>{ sfxVol=sfxVolEl.value/100; applySfx(); };

document.getElementById('fullscreenBtn').onclick=()=>{
  try{
    if(!document.fullscreenElement){
      const el=document.documentElement;
      const rq=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
      if(rq) rq.call(el);
    } else {
      (document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen||function(){}).call(document);
    }
  }catch(e){}
};
document.addEventListener('fullscreenchange', ()=>{ resize(); checkOrientation(); });

// ---------- 横屏提示 ----------
function checkOrientation(){
  const portrait = window.innerHeight > window.innerWidth;
  document.getElementById('rotate').classList.toggle('hidden', !portrait);
}
window.addEventListener('resize', checkOrientation);
checkOrientation();

document.getElementById('startBtn').onclick=()=>{
  document.getElementById('menu').classList.add('hidden');
  resetGame();
  initAudio(); startMusic();
  if(screen.orientation && screen.orientation.lock){
    try { const p=screen.orientation.lock('landscape'); if(p&&p.catch) p.catch(()=>{}); } catch(e){}
  }
  state='arrive';
  const sub=document.getElementById('subtitle');
  sub.classList.remove('hidden');
  setTimeout(()=>{ sub.classList.add('hidden'); state='city'; }, 1600);
};

resetGame(); last=performance.now(); requestAnimationFrame(frame);
</script>
