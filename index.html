<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>阿尔法大陆</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05070d; }
  body { font-family:"Courier New",monospace; color:#e2e8f0;
         touch-action:none; user-select:none; -webkit-user-select:none; }
  #cv { position:fixed; inset:0; display:block; touch-action:none; }
  .ov { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
        justify-content:center; gap:18px; background:rgba(5,7,13,.94); text-align:center; padding:24px; z-index:5; }
  .ov.hidden { display:none; }
  #menu .title { font-size:34px; font-weight:bold; color:#f8fafc; letter-spacing:5px;
                 text-shadow:3px 3px 0 #0284c7, 6px 6px 0 #000; }
  #menu .sub { color:#475569; letter-spacing:7px; font-size:12px; margin-top:-8px; }
  #subtitle .text { font-size:28px; font-weight:bold; color:#f8fafc; letter-spacing:4px;
                    text-shadow:3px 3px 0 #000; }
  button { font-family:"Courier New",monospace; font-weight:bold; font-size:17px;
           background:#4ade80; color:#052e16; border:2px solid #052e16; border-radius:0;
           box-shadow:0 4px 0 #052e16; padding:13px 34px; cursor:pointer; }
  button:active { transform:translateY(3px); box-shadow:0 1px 0 #052e16; }
  #fsBtn { position:fixed; top:8px; right:8px; z-index:6; padding:6px 10px; font-size:14px;
           background:rgba(15,23,42,.7); color:#e2e8f0; border:2px solid #0b0f1a;
           box-shadow:0 2px 0 #0b0f1a; }
  #fsBtn:active { transform:translateY(2px); box-shadow:0 0 0 #0b0f1a; }
  #rotate { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center;
            justify-content:center; gap:18px; background:#05070d; color:#e2e8f0; text-align:center; padding:24px; }
  #rotate.hidden { display:none; }
  #rotate .icon { font-size:56px; animation:rot 2.4s ease-in-out infinite; }
  #rotate .t { font-size:20px; font-weight:bold; letter-spacing:2px; }
  #rotate .d { color:#64748b; font-size:13px; }
  @keyframes rot { 0%,100%{transform:rotate(0)} 50%{transform:rotate(90deg)} }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="fsBtn">⛶ 全屏</button>

<div id="menu" class="ov">
  <div class="title">阿尔法大陆</div>
  <div class="sub">ALPHA LAND</div>
  <button id="startBtn">开始游戏</button>
</div>
<div id="subtitle" class="ov hidden">
  <div class="text">到达主城</div>
</div>
<div id="rotate" class="hidden">
  <div class="icon">📱</div>
  <div class="t">请把手机横过来</div>
  <div class="d">横屏游玩体验更好</div>
</div>

<script>
"use strict";
const VW=352, VH=176, TILE=16, WCOLS=44, WROWS=30;
const WORLD_W=WCOLS*TILE, WORLD_H=WROWS*TILE;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const off = document.createElement('canvas'); off.width=VW; off.height=VH;
const octx = off.getContext('2d'); octx.imageSmoothingEnabled=false;

let cssScale=1, oxCss=0, oyCss=0;
function resize(){
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  cssScale = Math.min(cv.width/VW, cv.height/VH);
  oxCss = (cv.width - VW*cssScale)/2;
  oyCss = (cv.height - VH*cssScale)/2;
  ctx.imageSmoothingEnabled = false;
}
resize();
window.addEventListener('resize', resize);

// ---------- 确定性随机 ----------
function hash(x,y){
  let h = (x|0)*374761393 + (y|0)*668265263;
  h = (h ^ (h>>>13)) * 1274126177;
  return ((h ^ (h>>>16)) >>> 0) / 4294967295;
}

// ---------- 世界生成 ----------
// 0 草地  1 石墙  2 边界(山/树/土丘)
const world = [];
for(let y=0;y<WROWS;y++){
  const row=[];
  for(let x=0;x<WCOLS;x++){
    const edge=Math.min(x,y,WCOLS-1-x,WROWS-1-y);
    row.push(edge<2?2:0);
  }
  world.push(row);
}
function stampWall(x,y,w,h){ for(let j=y;j<y+h;j++) for(let i=x;i<x+w;i++){ if(world[j]&&world[j][i]!==undefined) world[j][i]=1; } }
stampWall(6,5,6,4); stampWall(32,5,6,4);
stampWall(7,22,7,4); stampWall(31,22,6,4);

// ---------- 边界装饰（大小不一的山丘/树/灌木/草） ----------
const borderDeco = [];
(()=>{
  for(let y=0;y<WROWS;y++) for(let x=0;x<WCOLS;x++){
    if(world[y][x]!==2) continue;
    if(hash(x*7+1,y*11+3) < 0.4) continue;
    const jx=(hash(x+9,y+4)-0.5)*TILE*0.7;
    const jy=(hash(x+2,y+8)-0.5)*TILE*0.7;
    const s=0.7+hash(x+5,y+7)*0.9;
    const t=hash(x+3,y+9);
    const type = t<0.42?'tree': t<0.68?'mound': t<0.86?'bush':'grass';
    borderDeco.push({type, x:x*TILE+TILE/2+jx, y:y*TILE+TILE/2+jy, s});
  }
})();

// ---------- 状态 ----------
let state='menu', last=0;
let camX=0, camY=0, walkPhase=0;
let player = { x:360, y:248, hp:100, maxHp:100, r:6, speed:64, face:1 };
let level=0, xp=0, xpNeed=10;

function resetGame(){
  player = { x:360, y:248, hp:100, maxHp:100, r:6, speed:64, face:1 };
  level=0; xp=0; xpNeed=10; walkPhase=0;
  camX=player.x-VW/2; camY=player.y-VH/2;
}

// ---------- 输入 ----------
let joy={active:false, ox:0, oy:0, dx:0, dy:0};
const R=30;
function toV(x,y){ return [(x-oxCss)/cssScale, (y-oyCss)/cssScale]; }
function joyMove(x,y){
  const dx=x-joy.ox, dy=y-joy.oy, d=Math.hypot(dx,dy), m=d>R?R/d:1;
  joy.dx=dx*m; joy.dy=dy*m;
}
cv.addEventListener('touchstart', e=>{
  if(state!=='city') return;
  const t=e.touches[0]; const [vx,vy]=toV(t.clientX,t.clientY);
  joy.active=true; joy.ox=vx; joy.oy=vy; joy.dx=joy.dy=0;
}, {passive:true});
cv.addEventListener('touchmove', e=>{
  if(!joy.active) return;
  const t=e.touches[0]; const [vx,vy]=toV(t.clientX,t.clientY);
  joyMove(vx,vy);
}, {passive:true});
cv.addEventListener('touchend', ()=>{ joy.active=false; joy.dx=joy.dy=0; }, {passive:true});
cv.addEventListener('mousedown', e=>{ if(state!=='city')return; const [vx,vy]=toV(e.clientX,e.clientY); joy.active=true; joy.ox=vx; joy.oy=vy; joy.dx=joy.dy=0; });
cv.addEventListener('mousemove', e=>{ if(!joy.active)return; const [vx,vy]=toV(e.clientX,e.clientY); joyMove(vx,vy); });
cv.addEventListener('mouseup', ()=>{ joy.active=false; joy.dx=joy.dy=0; });

// ---------- 碰撞 ----------
function solidAt(px,py){
  const tx=Math.floor(px/TILE), ty=Math.floor(py/TILE);
  if(tx<0||ty<0||tx>=WCOLS||ty>=WROWS) return true;
  return world[ty][tx]!==0;
}
function tryMove(dx,dy){
  const half=5, nx=player.x+dx, ny=player.y+dy;
  const ok=(x,y)=> !solidAt(x-half,y-half)&&!solidAt(x+half,y-half)&&!solidAt(x-half,y+half)&&!solidAt(x+half,y+half);
  if(ok(nx,ny)){ player.x=nx; player.y=ny; return; }
  if(ok(nx,player.y)) player.x=nx;
  if(ok(player.x,ny)) player.y=ny;
}

function update(dt){
  if(joy.active){
    const d=Math.hypot(joy.dx,joy.dy);
    if(d>2){
      tryMove(joy.dx/d*player.speed*dt, joy.dy/d*player.speed*dt);
      walkPhase += dt*14;
      if(joy.dx>2) player.face=1; else if(joy.dx<-2) player.face=-1;
    }
  }
  camX = Math.max(0, Math.min(WORLD_W-VW, player.x-VW/2));
  camY = Math.max(0, Math.min(WORLD_H-VH, player.y-VH/2));
}

// ---------- 像素字体 ----------
const FONT = {
  '0':["111","101","101","101","111"], '1':["010","110","010","010","111"],
  '2':["111","001","111","100","111"], '3':["111","001","111","001","111"],
  '4':["101","101","111","001","001"], '5':["111","100","111","001","111"],
  '6':["111","100","111","101","111"], '7':["111","001","010","010","010"],
  '8':["111","101","111","101","111"], '9':["111","101","111","001","111"],
  'L':["100","100","100","100","111"], 'V':["101","101","101","101","010"],
};
const IC = { heart:[".1.1.","11111","11111",".111.","..1.."] };
function drawText(str, x, y, color, s=1){
  octx.fillStyle=color; let cx=x;
  for(let i=0;i<str.length;i++){
    const g=FONT[str[i]]||FONT['0'];
    for(let ry=0;ry<5;ry++) for(let rx=0;rx<3;rx++)
      if(g[ry][rx]==='1') octx.fillRect(cx+rx*s, y+ry*s, s, s);
    cx+=4*s;
  }
}
function drawIcon(icon, x, y, color, s=1){
  octx.fillStyle=color;
  for(let ry=0;ry<icon.length;ry++) for(let rx=0;rx<icon[ry].length;rx++)
    if(icon[ry][rx]!=='.') octx.fillRect(x+rx*s, y+ry*s, s, s);
}
function drawBar(x,y,w,h,frac,color){
  octx.fillStyle='#0b0f1a'; octx.fillRect(x-1,y-1,w+2,h+2);
  octx.fillStyle='#101826'; octx.fillRect(x,y,w,h);
  const fw=Math.round(w*frac);
  if(fw>0){
    octx.fillStyle=color; octx.fillRect(x,y,fw,h);
    octx.fillStyle='rgba(0,0,0,.3)';
    for(let gx=x+3; gx<x+fw; gx+=4) octx.fillRect(gx,y,1,h);
  }
}

// ---------- 绘制 ----------
function px(x,y,w,h,c){ octx.fillStyle=c; octx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
function fillCircle(x,y,r,c){ octx.fillStyle=c; octx.beginPath(); octx.arc(x,y,r,0,7); octx.fill(); }

function drawGrass(sx,sy,tx,ty){
  const h=hash(tx,ty);
  if(h<0.2){ octx.fillStyle='#74a852'; octx.fillRect(sx,sy,TILE,TILE); }
  else if(h>0.55 && h<0.65){ octx.fillStyle='#88bf66'; octx.fillRect(sx,sy,TILE,TILE); }
  for(let i=0;i<3;i++){
    const bx=sx+Math.floor(hash(tx*7+i,ty*13+i)*(TILE-2));
    const by=sy+Math.floor(hash(tx*3+i,ty*5+i)*(TILE-3));
    px(bx,by,1,2,'#639a45');
  }
  if(h>0.92){
    const fx=sx+4+Math.floor(hash(tx,ty)*6), fy=sy+4+Math.floor(hash(ty,tx)*6);
    px(fx,fy,2,2,'#fde047'); px(fx+1,fy+1,1,1,'#f59e0b');
  }
  else if(h<0.05){
    px(sx+5,sy+8,4,3,'#9aa5b1'); px(sx+6,sy+7,2,1,'#b4bec8');
  }
  else if(h>0.82 && h<0.86){
    px(sx+9,sy+10,5,4,'#4e7d36'); px(sx+10,sy+9,3,2,'#5f9440');
  }
}
function drawWall(sx,sy){
  px(sx, sy, TILE, TILE, '#7b8492');
  px(sx, sy, TILE, 3, '#98a1ae');
  px(sx, sy+TILE-3, TILE, 3, '#5f6773');
  octx.fillStyle='#5f6773';
  octx.fillRect(sx, sy+8, TILE, 1);
  octx.fillRect(sx+7, sy+3, 1, 5);
  octx.fillRect(sx+3, sy+9, 1, 4);
  octx.fillRect(sx+11, sy+9, 1, 4);
}
function drawBoundaryBase(sx,sy,tx,ty){
  const h=hash(tx*3+1,ty*7+5);
  octx.fillStyle = h<0.5 ? '#6b8a4e' : '#5f7d46';
  octx.fillRect(sx,sy,TILE,TILE);
  if(h>0.6) px(sx+3,sy+6,6,4,'#8a6b47');
  if(h<0.25) px(sx+9,sy+3,4,3,'#79a957');
}
function drawBorderDeco(d){
  const sx=d.x-camX, sy=d.y-camY;
  if(sx<-50||sx>VW+50||sy<-70||sy>VH+60) return;
  const k=d.s;
  if(d.type==='tree'){
    px(sx-2*k, sy+3*k, 4*k, 10*k, '#5b3a1e');
    fillCircle(sx, sy-3*k, 9*k, '#2f4a26');
    fillCircle(sx-3*k, sy-5*k, 6*k, '#3a5c2e');
    fillCircle(sx+3*k, sy-4*k, 5*k, '#446e34');
  } else if(d.type==='mound'){
    fillCircle(sx-2*k, sy+1*k, 9*k, '#7a5f3d');
    fillCircle(sx+3*k, sy+2*k, 7*k, '#6b5135');
    px(sx-1*k, sy-6*k, 1, 3, '#79a957');
    px(sx+4*k, sy-7*k, 1, 4, '#639a45');
  } else if(d.type==='bush'){
    fillCircle(sx, sy, 7*k, '#3a6a2c');
    fillCircle(sx-2*k, sy-2*k, 5*k, '#4e8538');
    fillCircle(sx+3*k, sy-1*k, 4*k, '#5f9440');
  } else {
    for(let i=0;i<3;i++) px(sx-5*k+i*5*k, sy-4*k, 1, 5*k, '#5f9440');
  }
}

// ---------- 主角（一格高，呆萌，无手） ----------
function drawHero(){
  const cx=player.x-camX, cy=player.y-camY;
  octx.fillStyle='rgba(0,0,0,.25)';
  octx.beginPath(); octx.ellipse(cx, cy+8, 5, 2, 0, 0, 7); octx.fill();

  const moving = joy.active && (Math.abs(joy.dx)+Math.abs(joy.dy))>2;
  const sw = moving ? Math.sin(walkPhase)*1.6 : 0;

  octx.save();
  octx.translate(cx, cy);
  if(player.face<0) octx.scale(-1,1);
  // 腿
  px(-2+sw, 4, 2, 3, '#e8eef0');
  px(0.5-sw, 4, 2, 3, '#e8eef0');
  // 脚
  px(-2.5+sw, 6, 3, 2, '#5a6673');
  px(0.5-sw, 6, 3, 2, '#5a6673');
  // 身体
  px(-3, 1, 6, 4, '#ffffff');
  // 头
  fillCircle(0, -3, 5.6, '#a9b6c3');
  fillCircle(0, -3, 5.0, '#ffffff');
  // 大眼睛
  px(-2.5, -5, 2, 3, '#1e293b');
  px(1, -5, 2, 3, '#1e293b');
  px(-2.5, -5, 1, 1, '#ffffff');
  px(1, -5, 1, 1, '#ffffff');
  octx.restore();
}

function drawHUD(){
  drawIcon(IC.heart, 4, 4, '#f43f5e');
  drawBar(11, 5, 64, 7, player.hp/player.maxHp, '#f43f5e');
  drawText(String(Math.max(0,Math.ceil(player.hp))), 11, 14, '#f8fafc');
  drawBar(4, 23, 71, 5, xp/xpNeed, '#38bdf8');
  drawText('LV', 4, 30, '#a5b4fc');
  drawText(String(level), 13, 30, '#f8fafc');
}

function render(){
  octx.clearRect(0,0,VW,VH);
  octx.fillStyle='#7db25a'; octx.fillRect(0,0,VW,VH);

  const x0=Math.max(0,Math.floor(camX/TILE)), x1=Math.min(WCOLS,Math.ceil((camX+VW)/TILE));
  const y0=Math.max(0,Math.floor(camY/TILE)), y1=Math.min(WROWS,Math.ceil((camY+VH)/TILE));
  for(let ty=y0; ty<y1; ty++) for(let tx=x0; tx<x1; tx++){
    const sx=tx*TILE-camX, sy=ty*TILE-camY, t=world[ty][tx];
    if(t===0) drawGrass(sx,sy,tx,ty);
    else if(t===1) drawWall(sx,sy);
    else drawBoundaryBase(sx,sy,tx,ty);
  }
  for(const d of borderDeco) drawBorderDeco(d);

  drawHero();
  drawHUD();

  if(joy.active){
    octx.strokeStyle='rgba(148,163,184,.35)'; octx.lineWidth=2;
    octx.beginPath(); octx.arc(joy.ox,joy.oy,R,0,7); octx.stroke();
    octx.fillStyle='rgba(148,163,184,.5)'; fillCircle(joy.ox+joy.dx, joy.oy+joy.dy, 7, 'rgba(148,163,184,.5)');
  }

  ctx.fillStyle='#05070d'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.drawImage(off, oxCss, oyCss, VW*cssScale, VH*cssScale);
}

function frame(now){
  const dt=Math.min((now-last)/1000,0.05); last=now;
  if(state==='city') update(dt);
  render();
  requestAnimationFrame(frame);
}

// ---------- 全屏 ----------
const fsBtn=document.getElementById('fsBtn');
fsBtn.onclick=()=>{
  try{
    if(!document.fullscreenElement){
      const el=document.documentElement;
      const rq=el.requestFullscreen||el.webkitRequestFullscreen;
      if(rq) rq.call(el);
    } else {
      if(document.exitFullscreen) document.exitFullscreen();
      else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
      else if(document.webkitCancelFullScreen) document.webkitCancelFullScreen();
    }
  }catch(e){}
};
document.addEventListener('fullscreenchange', ()=>{ resize(); checkOrientation(); });

// ---------- 横屏提示 ----------
function checkOrientation(){
  const portrait = window.innerHeight > window.innerWidth;
  document.getElementById('rotate').classList.toggle('hidden', !portrait);
}
window.addEventListener('resize', checkOrientation);
checkOrientation();

document.getElementById('startBtn').onclick=()=>{
  document.getElementById('menu').classList.add('hidden');
  resetGame();
  if(screen.orientation && screen.orientation.lock){
    try { const p=screen.orientation.lock('landscape'); if(p&&p.catch) p.catch(()=>{}); } catch(e){}
  }
  state='arrive';
  const sub=document.getElementById('subtitle');
  sub.classList.remove('hidden');
  setTimeout(()=>{ sub.classList.add('hidden'); state='city'; }, 1600);
};

resetGame(); last=performance.now(); requestAnimationFrame(frame);
</script>
</body>
</html>
