<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>星辰回响</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05070d; }
  body { font-family:"Courier New",monospace; color:#e2e8f0;
         touch-action:none; user-select:none; -webkit-user-select:none; }
  #cv { position:fixed; inset:0; display:block; touch-action:none; image-rendering:pixelated; }
  .ov { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
        justify-content:center; gap:18px; background:#05070d; text-align:center; padding:24px; z-index:5; }
  .ov.hidden { display:none; }
  #menu .title { font-size:34px; font-weight:bold; color:#f8fafc; letter-spacing:5px;
                 text-shadow:3px 3px 0 #0284c7, 6px 6px 0 #000; }
  #menu .sub { color:#475569; letter-spacing:7px; font-size:12px; margin-top:-8px; }
  #subtitle .text { font-size:28px; font-weight:bold; color:#f8fafc; letter-spacing:4px;
                    text-shadow:3px 3px 0 #000; }
  button { font-family:"Courier New",monospace; font-weight:bold; font-size:17px;
           background:#4ade80; color:#052e16; border:2px solid #052e16; border-radius:0;
           box-shadow:0 4px 0 #052e16; padding:13px 34px; cursor:pointer; }
  button:active { transform:translateY(3px); box-shadow:0 1px 0 #052e16; }
  #settingsBtn { position:fixed; z-index:6;
           top:calc(10px + env(safe-area-inset-top, 0px));
           right:calc(12px + env(safe-area-inset-right, 0px));
           width:44px; height:44px; padding:0;
           background:#9aa3ae; color:#1e293b; border:2px solid #4b5462; border-radius:6px;
           font-size:20px; box-shadow:none;
           display:flex; align-items:center; justify-content:center; }
  #settingsBtn:active { transform:translateY(2px); }
  #settingsBackdrop { position:fixed; inset:0; z-index:7; background:rgba(0,0,0,.45); }
  #settingsBackdrop.hidden, #settingsPanel.hidden { display:none; }
  #settingsPanel { position:fixed; z-index:8; top:0; right:0; bottom:0;
           width:min(300px, 74vw); background:#0d1524; border-left:2px solid #1e293b;
           padding:calc(14px + env(safe-area-inset-top, 0px)) 16px 18px;
           display:flex; flex-direction:column; gap:14px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .sp-title { font-size:18px; font-weight:bold; letter-spacing:2px; color:#f8fafc;
              display:flex; justify-content:space-between; align-items:center; }
  .sp-close { background:none; border:none; box-shadow:none; padding:0 6px; color:#94a3b8; font-size:24px; }
  .sp-group { display:flex; flex-direction:column; gap:8px; }
  .sp-label { font-size:14px; color:#cbd5e1; }
  .sp-row { display:flex; align-items:center; gap:10px; }
  .sp-toggle { width:50px; padding:7px 0; font-size:13px; background:#475569; color:#e2e8f0;
               border:2px solid #1e293b; box-shadow:0 2px 0 #1e293b; }
  .sp-toggle.on { background:#4ade80; color:#052e16; border-color:#052e16; }
  input[type=range] { flex:1; accent-color:#4ade80; }
  .sp-full { width:100%; background:#3b82f6; color:#eff6ff; border:2px solid #1e3a8a; box-shadow:0 3px 0 #1e3a8a; }
  .sp-page { display:flex; flex-direction:column; gap:12px; }
  .sp-page.hidden { display:none; }
  .sp-alt { background:#475569; color:#e2e8f0; border-color:#1e293b; box-shadow:0 3px 0 #1e293b; }
  .sp-danger { background:#dc2626; color:#fff; border-color:#7f1d1d; box-shadow:0 3px 0 #7f1d1d; }
  textarea { width:100%; min-height:64px; background:#0b1220; color:#cbd5e1; border:2px solid #1e293b;
             border-radius:4px; padding:8px; font-family:inherit; font-size:12px; resize:vertical; }
  #menuNotice { color:#fbbf24; font-size:12px; line-height:1.7; max-width:300px; margin-top:4px; }
  #bagBtn { position:fixed; z-index:6; left:calc(10px + env(safe-area-inset-left, 0px));
            bottom:calc(10px + env(safe-area-inset-bottom, 0px)); width:44px; height:44px; padding:0;
            background:#9aa3ae; color:#1e293b; border:2px solid #4b5462; border-radius:6px;
            box-shadow:none; display:flex; align-items:center; justify-content:center; }
  #bagBtn:active { transform:translateY(2px); }
  .eq-title { font-size:20px; font-weight:bold; letter-spacing:2px; color:#f8fafc; }
  .eq-section { color:#94a3b8; font-size:13px; margin-top:10px; letter-spacing:1px; }
  .eq-grid { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:340px; }
  .eq-slot { width:46px; height:46px; background:#4b5462; border:2px solid #0b0f1a;
             display:flex; align-items:center; justify-content:center; color:#2b3444;
             font-size:12px; font-weight:bold; }
  .modal { position:fixed; inset:0; z-index:9; display:flex; align-items:center; justify-content:center; }
  .modal.hidden { display:none; }
  .modal-bg { position:absolute; inset:0; background:rgba(110,116,128,.45); }
  .modal-box { position:relative; background:#0d1524; border:2px solid #1e293b; padding:16px;
               width:min(420px, 88vw); max-height:82vh; overflow-y:auto;
               display:flex; flex-direction:column; gap:10px; align-items:center; }
  .bag-grid { display:grid; grid-template-columns:repeat(10, 1fr); gap:4px;
              width:100%; max-height:52vh; overflow-y:scroll; overflow-x:hidden;
              scrollbar-width:thin; }
  .bag-grid::-webkit-scrollbar { width:10px; }
  .bag-grid::-webkit-scrollbar-track { background:#0b1220; border:1px solid #1e293b; }
  .bag-grid::-webkit-scrollbar-thumb { background:#4b5462; border:2px solid #0b1220; }
  .pixlabel { display:inline-flex; align-items:center; }
  .pixlabel canvas { image-rendering:pixelated; display:block; }
  .panel-head { display:flex; align-items:center; gap:10px; width:100%; }
  .panel-head .xBtn { margin-left:auto; }
  .xBtn { width:26px; height:26px; padding:0; font-size:13px; line-height:1;
          background:#4b5462; color:#e2e8f0; border:2px solid #0b0f1a; box-shadow:none;
          display:flex; align-items:center; justify-content:center; }
  .xBtn:active { transform:translateY(2px); }
  .pixlabel canvas { image-rendering:pixelated; display:block; }
  .eq-cols { display:flex; gap:20px; align-items:flex-start; }
  .eq-col { display:flex; flex-direction:column; gap:8px; }
  .eq-cap { font-size:12px; color:#94a3b8; letter-spacing:2px; text-align:left; width:100%; }
  .eq-row { display:flex; gap:8px; }
  .eq-box .eq-slot { width:52px; height:52px; }
  .bag-grid .eq-slot { width:100%; aspect-ratio:1/1; }
  #rotate { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center;
            justify-content:center; gap:18px; background:#05070d; color:#e2e8f0; text-align:center; padding:24px; }
  #rotate.hidden { display:none; }
  #rotate .icon { font-size:56px; animation:rot 2.4s ease-in-out infinite; }
  #rotate .t { font-size:20px; font-weight:bold; letter-spacing:2px; }
  #rotate .d { color:#64748b; font-size:13px; }
  @keyframes rot { 0%,100%{transform:rotate(0)} 50%{transform:rotate(90deg)} }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="settingsBtn">⚙</button>
<button id="bagBtn">
  <svg width="22" height="22" viewBox="0 0 11 11" shape-rendering="crispEdges">
    <rect x="4" y="0" width="3" height="1" fill="#1e293b"/>
    <rect x="3" y="1" width="1" height="2" fill="#1e293b"/>
    <rect x="7" y="1" width="1" height="2" fill="#1e293b"/>
    <rect x="2" y="3" width="7" height="7" fill="#8a6440"/>
    <rect x="2" y="3" width="7" height="2" fill="#a87c50"/>
    <rect x="4" y="6" width="3" height="1" fill="#5f4127"/>
    <rect x="4" y="7" width="3" height="2" fill="#6b4a2e"/>
  </svg>
</button>
<div id="equipWrap" class="modal hidden">
  <div class="modal-bg" id="equipBg"></div>
  <div class="modal-box eq-box">
    <div class="panel-head">
      <span class="pixlabel" id="eqTitle"></span>
      <button class="xBtn" id="eqClose">✕</button>
    </div>
    <div class="eq-cols">
      <div class="eq-col">
        <div class="eq-cap pixlabel" id="capW"></div>
        <div class="eq-row"><div class="eq-slot"></div><div class="eq-slot"></div><div class="eq-slot"></div></div>
        <div class="eq-cap pixlabel" id="capA"></div>
        <div class="eq-row">
          <div class="eq-slot" data-armor="0"></div>
          <div class="eq-slot" data-armor="1"></div>
          <div class="eq-slot" data-armor="2"></div>
        </div>
      </div>
      <div class="eq-col">
        <div class="eq-cap pixlabel" id="capAcc"></div>
        <div class="eq-row"><div class="eq-slot"></div><div class="eq-slot"></div><div class="eq-slot"></div></div>
        <div class="eq-row"><div class="eq-slot"></div><div class="eq-slot"></div><div class="eq-slot"></div></div>
      </div>
    </div>
  </div>
</div>
<div id="bagWrap" class="modal hidden">
  <div class="modal-bg" id="bagBg"></div>
  <div class="modal-box">
    <div class="panel-head">
      <span class="pixlabel" id="bagTitle"></span>
      <span class="pixlabel" id="bagCap"></span>
      <button class="xBtn" id="bagClose">✕</button>
    </div>
    <div class="bag-grid" id="bagGrid"></div>
  </div>
</div>
<div id="settingsBackdrop" class="hidden"></div>
<div id="settingsPanel" class="hidden">
  <div class="sp-title">设置<button id="settingsClose" class="sp-close">×</button></div>
  <div id="spMain" class="sp-page">
    <div class="sp-group">
      <div class="sp-label">音乐</div>
      <div class="sp-row">
        <button id="musicToggle" class="sp-toggle on">开</button>
        <input type="range" id="musicVol" min="0" max="100" value="60">
      </div>
    </div>
    <div class="sp-group">
      <div class="sp-label">音效</div>
      <div class="sp-row">
        <button id="sfxToggle" class="sp-toggle on">开</button>
        <input type="range" id="sfxVol" min="0" max="100" value="70">
      </div>
    </div>
    <button id="fullscreenBtn" class="sp-full">全屏</button>
    <button id="openSave" class="sp-full sp-alt">存档</button>
  </div>
  <div id="spSave" class="sp-page hidden">
    <div class="sp-label">存档管理</div>
    <button id="saveExport" class="sp-full">导出存档文件</button>
    <button id="saveImportBtn" class="sp-full">导入存档文件</button>
    <input type="file" id="saveFile" style="display:none">
    <div class="sp-label">存档码</div>
    <textarea id="saveCodeShow" readonly placeholder="点下方按钮生成存档码"></textarea>
    <button id="saveCodeGen" class="sp-full sp-alt">生成并复制存档码</button>
    <textarea id="saveCodeIn" placeholder="把存档码粘贴到这里"></textarea>
    <button id="saveCodeLoad" class="sp-full">用存档码导入</button>
    <button id="saveClear" class="sp-full sp-danger">清除存档数据</button>
    <button id="saveBack" class="sp-full sp-alt">返回</button>
  </div>
</div>

<div id="menu" class="ov">
  <div class="title">星辰回响</div>
  <div class="sub">STELLAR ECHO</div>
  <button id="startBtn">开始游戏</button>
  <div id="menuNotice">⚠ 清除浏览器缓存会导致存档丢失，建议在「设置 → 存档」里导出备份或保存存档码</div>
</div>
<div id="subtitle" class="ov hidden">
  <div class="text">到达主城</div>
</div>
<div id="rotate" class="hidden">
  <div class="icon">📱</div>
  <div class="t">请把手机横过来</div>
  <div class="d">横屏游玩体验更好</div>
</div>

<script>
"use strict";
let VW=352, VH=176;
const TILE=16, WCOLS=64, WROWS=44;
const RES=2;   // 内部渲染精度：2 倍，像素视觉大小不变，但镜头可半格移动
const WORLD_W=WCOLS*TILE, WORLD_H=WROWS*TILE;
let JBX=70, JBY=140; const JR=26;   // 常驻摇杆位置（左下，随屏幕）
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const off = document.createElement('canvas'); off.width=VW*RES; off.height=VH*RES;
let octx = off.getContext('2d'); octx.imageSmoothingEnabled=false; octx.setTransform(RES,0,0,RES,0,0);
// 静态地面预渲染
const groundCanvas = document.createElement('canvas');
groundCanvas.width = WORLD_W*RES; groundCanvas.height = WORLD_H*RES;
const gctx = groundCanvas.getContext('2d');
gctx.imageSmoothingEnabled = false;
gctx.setTransform(RES,0,0,RES,0,0);
let baking = false;

let cssScale=1, oxCss=0, oyCss=0, dpr=1;
function resize(){
  dpr = window.devicePixelRatio || 1;
  const W = window.innerWidth, H = window.innerHeight;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  cv.style.width = W+'px'; cv.style.height = H+'px';
  // 每个美术像素占 P 个设备像素（偶数，配合 2 倍内部渲染）
  let P = Math.round(Math.min(cv.width, cv.height)/195);
  P = Math.max(4, P - (P%2));
  cssScale = P;
  // 可视区域随屏幕自适应，填满
  VW = Math.min(WORLD_W, Math.floor(cv.width/P));
  VH = Math.min(WORLD_H, Math.floor(cv.height/P));
  off.width = VW*RES; off.height = VH*RES;
  octx.imageSmoothingEnabled = false;
  octx.setTransform(RES,0,0,RES,0,0);
  oxCss = Math.floor((cv.width - VW*P)/2);
  oyCss = Math.floor((cv.height - VH*P)/2);
  ctx.imageSmoothingEnabled = false;
  JBX = VW*0.15; JBY = VH*0.82;
}
resize();
window.addEventListener('resize', resize);

// ---------- 确定性随机 ----------
function hash(x,y){
  let h = (x|0)*374761393 + (y|0)*668265263;
  h = (h ^ (h>>>13)) * 1274126177;
  return ((h ^ (h>>>16)) >>> 0) / 4294967295;
}

// ---------- 世界生成 ----------
// 0 草地  2 边界丘陵
const world = [];
for(let y=0;y<WROWS;y++){
  const row=[];
  for(let x=0;x<WCOLS;x++){
    const edge=Math.min(x,y,WCOLS-1-x,WROWS-1-y);
    row.push(edge<3?2:0);
  }
  world.push(row);
}

// ---------- 房屋 ----------
const BUILDINGS = [
  {x:440, y:280, w:88, h:76, v:0, c:0, ch:1},
  {x:556, y:300, w:64, h:60, v:1, c:0},
  {x:330, y:270, w:64, h:58, v:2, c:0},
  {x:240, y:330, w:56, h:54, v:3, c:0},
  {x:740, y:270, w:66, h:60, v:1, c:1},
  {x:820, y:330, w:60, h:56, v:2, c:1, ch:1},
  {x:530, y:170, w:70, h:64, v:0, c:2},
  {x:400, y:170, w:58, h:52, v:3, c:1},
];

// ---------- 道路（土黄路，宽窄不一） ----------
const ROADS = [
  {x1:680, y1:-20, x2:680, y2:760, w:46},  // 主路（竖）
  {x1:60,  y1:440, x2:980, y2:440, w:40},  // 横路
  {x1:484, y1:356, x2:484, y2:440, w:24},  // 通往大房子
  {x1:588, y1:360, x2:588, y2:440, w:24},  // 通往小房子
];

// ---------- 路面遮罩（2 像素一格，边缘随机） ----------
const MW=Math.ceil(WORLD_W/2), MH=Math.ceil(WORLD_H/2);
const roadMask=new Uint8Array(MW*MH);
const tileRoadCnt=new Uint8Array(WCOLS*WROWS);
for(let my=0;my<MH;my++) for(let mx=0;mx<MW;mx++){
  const wx=mx*2+1, wy=my*2+1;
  let best=1e9;
  for(const r of ROADS){ const d=segDist(wx,wy,r.x1,r.y1,r.x2,r.y2)-r.w/2; if(d<best) best=d; }
  const n=(hash(mx*7+3,my*5+1)-0.5)*6;
  roadMask[my*MW+mx]=(best+n<0)?1:0;
}
for(let ty=0;ty<WROWS;ty++) for(let tx=0;tx<WCOLS;tx++){
  let c=0;
  for(let j=0;j<8;j++) for(let i=0;i<8;i++) c+=roadMask[(ty*8+j)*MW+(tx*8+i)]||0;
  tileRoadCnt[ty*WCOLS+tx]=c;
}

// ---------- 河流与桥 ----------
const RIVER={x1:-30,y1:540,x2:1060,y2:540,w:78};
const BRIDGE={x:655,y:490,w:48,h:104};
const waterMask=new Uint8Array(MW*MH);
const tileWaterCnt=new Uint8Array(WCOLS*WROWS);
for(let my=0;my<MH;my++) for(let mx=0;mx<MW;mx++){
  const wx=mx*2+1, wy=my*2+1;
  let d=segDist(wx,wy,RIVER.x1,RIVER.y1,RIVER.x2,RIVER.y2)-RIVER.w/2;
  d += (hash(mx*3+7,my*9+2)-0.5)*7;
  waterMask[my*MW+mx]=(d<0)?1:0;
}
for(let ty=0;ty<WROWS;ty++) for(let tx=0;tx<WCOLS;tx++){
  let c=0;
  for(let j=0;j<8;j++) for(let i=0;i<8;i++) c+=waterMask[(ty*8+j)*MW+(tx*8+i)]||0;
  tileWaterCnt[ty*WCOLS+tx]=c;
}
function waterAt(px,py){
  if(px>BRIDGE.x&&px<BRIDGE.x+BRIDGE.w&&py>BRIDGE.y&&py<BRIDGE.y+BRIDGE.h) return false;
  const mx=Math.floor(px/2), my=Math.floor(py/2);
  if(mx<0||my<0||mx>=MW||my>=MH) return false;
  return waterMask[my*MW+mx]===1;
}

// ---------- 边界装饰（大小/种类不一的丘陵、树、灌木、草、花、石） ----------
const borderDeco = [];
(()=>{
  for(let y=0;y<WROWS;y++) for(let x=0;x<WCOLS;x++){
    if(world[y][x]!==2) continue;
    if(hash(x*7+1,y*11+3) < 0.22) continue;
    const jx=(hash(x+9,y+4)-0.5)*TILE*0.8;
    const jy=(hash(x+2,y+8)-0.5)*TILE*0.8;
    const s=0.6+hash(x+5,y+7)*1.0;
    const t=hash(x+3,y+9);
    let type;
    if(t<0.28) type='tree';
    else if(t<0.40) type='pine';
    else if(t<0.58) type='mound';
    else if(t<0.72) type='bush';
    else if(t<0.84) type='grass';
    else if(t<0.93) type='flower';
    else type='rock';
    borderDeco.push({type, x:x*TILE+TILE/2+jx, y:y*TILE+TILE/2+jy, s, v:hash(x+1,y+2)});
  }
})();

// ---------- 状态 ----------
let state='menu', last=0;
let camX=0, camY=0, camXs=0, camYs=0, walkPhase=0;
let player = { x:680, y:448, hp:100, maxHp:100, r:6, speed:80, face:1 };
let level=0, xp=0, xpNeed=10;

function resetGame(){
  player = { x:680, y:448, hp:100, maxHp:100, r:6, speed:80, face:1 };
  level=0; xp=0; xpNeed=10; walkPhase=0; lastStep=-1;
  camX=Math.max(0,Math.min(WORLD_W-VW, player.x-VW/2));
  camY=Math.max(0,Math.min(WORLD_H-VH, player.y-VH/2));
  camXs=camX; camYs=camY;
}

// ---------- 输入（常驻摇杆，仅右下角 1/4 可操作） ----------
let joy={active:false, dx:0, dy:0};
function toV(x,y){ return [((x*dpr)-oxCss)/cssScale, ((y*dpr)-oyCss)/cssScale]; }
function joyMove(vx,vy){
  const dx=vx-JBX, dy=vy-JBY, d=Math.hypot(dx,dy), m=d>JR?JR/d:1;
  joy.dx=dx*m; joy.dy=dy*m;
}
cv.addEventListener('touchstart', e=>{
  if(state!=='city') return;
  const t=e.touches[0]; const [vx,vy]=toV(t.clientX,t.clientY);
  const L=equipLayout();
  if(vx>=L.swx&&vx<=L.swx+L.swordS&&vy>=L.swy&&vy<=L.swy+L.swordS){ openEquip(); return; }
  if(vx < VW*0.5 && vy > VH*0.5){ joy.active=true; joyMove(vx,vy); }
}, {passive:true});
cv.addEventListener('touchmove', e=>{
  if(!joy.active) return;
  const t=e.touches[0]; const [vx,vy]=toV(t.clientX,t.clientY);
  joyMove(vx,vy);
}, {passive:true});
cv.addEventListener('touchend', ()=>{ joy.active=false; joy.dx=joy.dy=0; }, {passive:true});
cv.addEventListener('touchcancel', ()=>{ joy.active=false; joy.dx=joy.dy=0; }, {passive:true});
cv.addEventListener('mousedown', e=>{
  if(state!=='city')return; const [vx,vy]=toV(e.clientX,e.clientY);
  const L=equipLayout();
  if(vx>=L.swx&&vx<=L.swx+L.swordS&&vy>=L.swy&&vy<=L.swy+L.swordS){ openEquip(); return; }
  if(vx<VW*0.5 && vy>VH*0.5){ joy.active=true; joyMove(vx,vy); }
});

// ---------- 碰撞 ----------
function solidAt(px,py){
  const tx=Math.floor(px/TILE), ty=Math.floor(py/TILE);
  if(tx<0||ty<0||tx>=WCOLS||ty>=WROWS) return true;
  if(world[ty][tx]!==0) return true;
  for(const b of BUILDINGS){ if(px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h) return true; }
  for(const p of PROPS){
    let x0,y0,x1,y1;
    if(p.type==='well'){ x0=p.x-14; y0=p.y-8; x1=p.x+14; y1=p.y+2; }
    else if(p.type==='flower'){ x0=p.x-13; y0=p.y-7; x1=p.x+13; y1=p.y+1; }
    else if(p.type==='crate'){ x0=p.x-6; y0=p.y-10; x1=p.x+6; y1=p.y; }
    else if(p.type==='lamp'){ x0=p.x-3; y0=p.y-24; x1=p.x+3; y1=p.y; }
    else if(p.type==='fence'){ x0=p.x; y0=p.y-12; x1=p.x+(p.n||5)*6; y1=p.y; }
    else continue;
    if(px>=x0&&px<=x1&&py>=y0&&py<=y1) return true;
  }
  if(waterAt(px,py)) return true;
  return false;
}
function tryMove(dx,dy){
  const half=5, nx=player.x+dx, ny=player.y+dy;
  const ok=(x,y)=> !solidAt(x,y)&&!solidAt(x-half,y-half)&&!solidAt(x+half,y-half)&&!solidAt(x-half,y+half)&&!solidAt(x+half,y+half);
  if(ok(nx,ny)){ player.x=nx; player.y=ny; return; }
  if(ok(nx,player.y)) player.x=nx;
  if(ok(player.x,ny)) player.y=ny;
}

function update(dt){
  if(joy.active){
    const d=Math.hypot(joy.dx,joy.dy);
    if(d>2){
      tryMove(joy.dx/d*player.speed*dt, joy.dy/d*player.speed*dt);
      walkPhase += dt*16;
      const si=Math.floor(walkPhase/Math.PI);
      if(si!==lastStep){ lastStep=si; playStep(); }
      if(joy.dx>2) player.face=1; else if(joy.dx<-2) player.face=-1;
    }
  }
  if(!(joy.active && Math.hypot(joy.dx,joy.dy)>2)) walkPhase = 0;
  const tcx=Math.max(0, Math.min(WORLD_W-VW, player.x-VW/2));
  const tcy=Math.max(0, Math.min(WORLD_H-VH, player.y-VH/2));
  const k=1-Math.exp(-dt*12);
  camXs += (tcx-camXs)*k;
  camYs += (tcy-camYs)*k;
  camX = Math.round(camXs*RES)/RES;
  camY = Math.round(camYs*RES)/RES;
}

// ---------- 绘制 ----------
function px(x,y,w,h,c){ octx.fillStyle=c; octx.fillRect(Math.round(x*RES)/RES,Math.round(y*RES)/RES,Math.round(w*RES)/RES,Math.round(h*RES)/RES); }
function fillCircle(x,y,r,c){ octx.fillStyle=c; octx.beginPath(); octx.arc(x,y,r,0,7); octx.fill(); }

function drawGrass(sx,sy,tx,ty){
  const h=hash(tx,ty);
  if(h<0.2){ octx.fillStyle='#74a852'; octx.fillRect(sx,sy,TILE,TILE); }
  else if(h>0.55 && h<0.65){ octx.fillStyle='#88bf66'; octx.fillRect(sx,sy,TILE,TILE); }
  for(let i=0;i<3;i++){
    const bx=sx+Math.floor(hash(tx*7+i,ty*13+i)*(TILE-2));
    const by=sy+Math.floor(hash(tx*3+i,ty*5+i)*(TILE-3));
    px(bx,by,1,2,'#639a45');
  }
  if(h>0.92){
    const fx=sx+4+Math.floor(hash(tx,ty)*6), fy=sy+4+Math.floor(hash(ty,tx)*6);
    px(fx,fy,2,2,'#fde047'); px(fx+1,fy+1,1,1,'#f59e0b');
  } else if(h<0.05){
    px(sx+5,sy+8,4,3,'#9aa5b1'); px(sx+6,sy+7,2,1,'#b4bec8');
  } else if(h>0.82 && h<0.86){
    px(sx+9,sy+10,5,4,'#4e7d36'); px(sx+10,sy+9,3,2,'#5f9440');
  }
}
function segDist(px,py,x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1, l2=dx*dx+dy*dy;
  let t = l2 ? ((px-x1)*dx+(py-y1)*dy)/l2 : 0;
  t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
}
function roadVal(tx,ty){
  const cx=tx*TILE+TILE/2, cy=ty*TILE+TILE/2;
  let best=1e9;
  for(const r of ROADS){
    const d=segDist(cx,cy,r.x1,r.y1,r.x2,r.y2)-r.w/2;
    if(d<best) best=d;
  }
  const n=(hash(tx*5+1,ty*7+3)-0.5)*10;
  const v=best+n;
  if(v<=-7) return 1;
  if(v>=7) return 0;
  return (7-v)/14;
}
function drawDirt(sx,sy,tx,ty,rv){
  octx.fillStyle='#c9a96b'; octx.fillRect(sx,sy,TILE,TILE);
  for(let i=0;i<3;i++){
    const bx=sx+Math.floor(hash(tx*7+i,ty*11+i)*(TILE-2));
    const by=sy+Math.floor(hash(tx*3+i,ty*5+i)*(TILE-2));
    px(bx,by,2,1, hash(tx+i,ty+i)>0.5?'#d8bd85':'#b08f55');
  }
  // 边缘随机混草，形成不规则路沿
  if(rv<0.85){
    const n=Math.floor((1-rv)*9);
    for(let i=0;i<n;i++){
      const bx=sx+Math.floor(hash(tx*13+i,ty*7+i)*TILE);
      const by=sy+Math.floor(hash(tx*5+i,ty*13+i)*TILE);
      px(bx,by,2,1,'#7db25a');
    }
  }
  if(hash(tx,ty)>0.85) px(sx+6,sy+9,3,2,'#9aa5b1');
}
function drawGroundTile(sx,sy,tx,ty){
  const cnt=tileRoadCnt[ty*WCOLS+tx];
  if(cnt===0){ drawGrass(sx,sy,tx,ty); return; }
  if(cnt>=64){ drawDirt(sx,sy,tx,ty,1); return; }
  drawGrass(sx,sy,tx,ty);
  for(let j=0;j<8;j++) for(let i=0;i<8;i++){
    if(roadMask[(ty*8+j)*MW+(tx*8+i)]){
      px(sx+i*2, sy+j*2, 2, 2, hash(tx*8+i,ty*8+j)>0.5?'#c9a96b':'#bfa06a');
    }
  }
}
function drawWaterTile(sx,sy,tx,ty){
  const cnt=tileWaterCnt[ty*WCOLS+tx];
  if(cnt===0){ drawGroundTile(sx,sy,tx,ty); return; }
  if(cnt>=64){
    px(sx,sy,TILE,TILE,'#2f6fb0');
    if(hash(tx,ty)>0.5){ px(sx+3,sy+5,5,1,'#4a8fd4'); px(sx+9,sy+11,4,1,'#4a8fd4'); }
    else { px(sx+5,sy+9,6,1,'#4a8fd4'); }
    return;
  }
  drawGrass(sx,sy,tx,ty);
  for(let j=0;j<8;j++) for(let i=0;i<8;i++){
    if(waterMask[(ty*8+j)*MW+(tx*8+i)]) px(sx+i*2, sy+j*2, 2,2, '#2f6fb0');

}

  px(x+4, baseY, w-8, 8, '#8d8a80');

    px(x+4, wallTop-2, w-8, 2, pal.beam);

  }

  // 烟囱：只给带 ch 的房子，先画再被屋顶盖住

function render(){
  octx.clearRect(0,0,VW,VH);
  octx.fillStyle='#7db25a'; octx.fillRect(0,0,VW,VH);

  octx.save();
  octx.setTransform(1,0,0,1,0,0);
  octx.drawImage(groundCanvas, camX*RES, camY*RES, VW*RES, VH*RES, 0, 0, VW*RES, VH*RES);
  octx.restore();
  const ds=[];
  for(const b of BUILDINGS) ds.push({bottom:b.y+b.h, draw:()=>drawHouse(b)});
  for(const p of PROPS) ds.push({bottom:p.y, draw:()=>drawProp(p)});
  ds.push({bottom:NPC.y, draw:drawNPC});
  ds.sort((a,b)=>a.bottom-b.bottom);
  for(const d of ds){ if(d.bottom<=player.y) d.draw(); }
  drawHero();
  for(const d of ds){ if(d.bottom>player.y) d.draw(); }
  drawHUD();
  const ft=fpsVal+' FPS';
  drawText(ft, VW-6-(ft.length*4), 32, '#4ade80');
  if(state==='city'){ drawEquipHUD(); drawJoystick(); }

  ctx.fillStyle='#05070d'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.drawImage(off, oxCss, oyCss, VW*cssScale, VH*cssScale);
}

let fpsFrames=0, fpsLast=0, fpsVal=0;
function frame(now){
  const dt=Math.min((now-last)/1000,0.05); last=now;
  if(state==='city') update(dt);
  render();
  fpsFrames++;
  if(now-fpsLast>=500){
    fpsVal = Math.round(fpsFrames*1000/(now-fpsLast));
    fpsFrames=0; fpsLast=now;
  }
  requestAnimationFrame(frame);
}

// ---------- 背景音乐（舒缓合成） ----------
let actx=null, master=null, noteBus=null, sfxGain=null, musicOn=true, sfxOn=true, schedStarted=false;
let musicVol=0.6, sfxVol=0.7, noiseBuf=null, lastStep=-1;
let nextTime=0, beatIndex=0;
const BPM=72, BEAT=60/BPM;

function initAudio(){
  if(actx) return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  actx=new AC();
  master=actx.createGain(); master.gain.value=musicOn?musicVol*0.8:0; master.connect(actx.destination);
  sfxGain=actx.createGain(); sfxGain.gain.value=sfxOn?sfxVol*0.9:0; sfxGain.connect(actx.destination);
  const nlen=Math.floor(actx.sampleRate*0.2);
  noiseBuf=actx.createBuffer(1,nlen,actx.sampleRate);
  const nd=noiseBuf.getChannelData(0);
  for(let i=0;i<nlen;i++) nd[i]=Math.random()*2-1;
  const lp=actx.createBiquadFilter();
  lp.type='lowpass'; lp.frequency.value=1500; lp.Q.value=0.2; lp.connect(master);
  noteBus=actx.createGain(); noteBus.gain.value=0.5; noteBus.connect(lp);
  const delay=actx.createDelay(1.0); delay.delayTime.value=0.36;
  const fb=actx.createGain(); fb.gain.value=0.28;
  const wet=actx.createGain(); wet.gain.value=0.22;
  delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(master);
  const send=actx.createGain(); send.gain.value=0.35;
  noteBus.connect(send); send.connect(delay);
}
function note(freq, t, dur, type, vol, atk, rel){
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur+rel);
  o.connect(g); g.connect(noteBus);
  o.start(t); o.stop(t+dur+rel+0.05);
}
const BARS=[
  {chord:[261.63,329.63,392.00,493.88], bass:130.81},
  {chord:[220.00,261.63,329.63,392.00], bass:110.00},
  {chord:[174.61,220.00,261.63,329.63], bass:87.31},
  {chord:[196.00,246.94,293.66,392.00], bass:98.00},
];
const PENTA=[523.25,587.33,659.25,783.99,880.00];
function scheduleBeat(bi, t){
  const bar=Math.floor(bi/4)%BARS.length, b=bi%4;
  if(b===0){
    for(const f of BARS[bar].chord) note(f, t, BEAT*4*0.9, 'sine', 0.05, 0.8, 1.4);
    note(BARS[bar].bass, t, BEAT*4*0.85, 'sine', 0.09, 0.5, 1.2);
  }
  if((b===2 && Math.random()<0.55) || (b===3 && Math.random()<0.22)){
    note(PENTA[Math.floor(Math.random()*PENTA.length)], t, BEAT*1.1, 'triangle', 0.03, 0.15, 0.9);
  }
}
function scheduler(){
  if(!actx) return;
  while(nextTime < actx.currentTime + 0.4){ scheduleBeat(beatIndex, nextTime); nextTime+=BEAT; beatIndex++; }
}
function startMusic(){
  if(!actx) return;
  if(actx.state==='suspended') actx.resume();
  if(!schedStarted){ schedStarted=true; nextTime=actx.currentTime+0.1; beatIndex=0; setInterval(scheduler,120); }
}
function playStep(){
  if(!actx || !sfxOn || !noiseBuf) return;
  const t=actx.currentTime;
  const src=actx.createBufferSource(); src.buffer=noiseBuf;
  const lp=actx.createBiquadFilter(); lp.type='lowpass';
  lp.frequency.value=1100+Math.random()*300; lp.Q.value=0.5;
  const g=actx.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.07, t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.14);
  src.connect(lp); lp.connect(g); g.connect(sfxGain);
  src.start(t); src.stop(t+0.16);
}
function applyMusic(){ if(actx&&master) master.gain.setTargetAtTime(musicOn?musicVol*0.8:0, actx.currentTime, 0.05); }
function applySfx(){ if(actx&&sfxGain) sfxGain.gain.setTargetAtTime(sfxOn?sfxVol*0.9:0, actx.currentTime, 0.05); }
document.addEventListener('visibilitychange', ()=>{
  if(!actx) return;
  if(document.hidden){ actx.suspend(); } else { actx.resume(); }
});

const SAVE_KEY='xingchen_huixiang_save_v1';
const SAVE_SIG='星辰回响';
const SAVE_VER=1;
let hasSave=false;

function collectSave(){
  return { sig:SAVE_SIG, ver:SAVE_VER, at:Date.now(),
    p:{ x:player.x, y:player.y, hp:player.hp, maxHp:player.maxHp, speed:player.speed },
    lv:level, xp:xp, need:xpNeed };
}
function applySave(s){
  if(!s || s.sig!==SAVE_SIG) return false;
  const p=player;
  if(s.p){ p.x=s.p.x; p.y=s.p.y; p.hp=s.p.hp; p.maxHp=s.p.maxHp; p.speed=s.p.speed||80; }
  if(solidAt(p.x,p.y)){ p.x=680; p.y=448; }   // 旧存档位置若已不可站立则回出生点
  level=s.lv||0; xp=s.xp||0; xpNeed=s.need||10;
  camXs=Math.max(0,Math.min(WORLD_W-VW, p.x-VW/2));
  camYs=Math.max(0,Math.min(WORLD_H-VH, p.y-VH/2));
  camX=Math.round(camXs*RES)/RES; camY=Math.round(camYs*RES)/RES;
  return true;
}
function saveGame(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(collectSave())); }catch(e){}
}
function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    return applySave(JSON.parse(raw));
  }catch(e){ return false; }
}
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function downloadSave(){
  const blob=new Blob([JSON.stringify(collectSave())],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='星辰回响-存档-'+new Date().toISOString().slice(0,10)+'.star';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function readSaveFile(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      if(applySave(JSON.parse(r.result))){ saveGame(); alert('存档导入成功'); }
      else alert('这不是有效的「星辰回响」存档');
    }catch(e){ alert('存档文件损坏或格式不对'); }
  };
  r.readAsText(file);
}
function makeSaveCode(){ return btoa(unescape(encodeURIComponent(JSON.stringify(collectSave())))); }
function useSaveCode(code){
  try{ return applySave(JSON.parse(decodeURIComponent(escape(atob(code.trim()))))); }
  catch(e){ return false; }
}

const EQUIP={weapons:[null,null,null], armors:[null,null,null], accessories:[null,null,null,null,null,null]};

function equipLayout(){
  const pad=3, labelH=7, gap=6, swordS=18;
  const WS=22, Wgap=4, weaponW=3*WS+2*Wgap;
  const GW=weaponW+pad*2, GH=labelH+WS+pad*2;
  const AS=12, Agap=3, armorW=3*AS+2*Agap;
  const GA=armorW+pad*2, GAH=labelH+AS+pad*2;
  const SS=10, Sgap=2, accW=3*SS+2*Sgap, accH=2*SS+Sgap;
  const GS=accW+pad*2, GSH=labelH+accH+pad*2;
  const totalW=GA+gap+GW+gap+GS+gap+swordS;
  const x0=Math.round(VW/2-totalW/2), bottom=VH-5;
  return {
    pad,labelH,gap,swordS,WS,AS,SS,GW,GH,GA,GAH,GS,GSH,
    ax:x0, ay:bottom-GAH,
    wx:x0+GA+gap, wy:bottom-GH,
    sx:x0+GA+gap+GW+gap, sy:bottom-GSH,
    swx:x0+GA+gap+GW+gap+GS+gap, swy:bottom-swordS
  };
}
function eqSlot(x,y,sz){
  octx.fillStyle='#0b0f1a'; octx.fillRect(x-1,y-1,sz+2,sz+2);
  octx.fillStyle='#4b5462'; octx.fillRect(x,y,sz,sz);
  octx.fillStyle='#3a4250'; octx.fillRect(x+1,y+1,sz-2,sz-2);
  octx.fillStyle='#5b6472'; octx.fillRect(x+1,y+1,sz-2,1);
}
function armorIcon(x,y,sz,i){
  const c1='#9aa5b1', c2='#74808e', d='#232c38';
  if(i===0){ // 头盔：圆顶 + 面窗缝 + 护颊 + 下颌
    px(x+4,y+2,4,1,c1);
    px(x+3,y+3,6,1,c1);
    px(x+2,y+4,8,2,c1);
    px(x+3,y+6,6,1,d);
    px(x+2,y+6,1,3,c2); px(x+9,y+6,1,3,c2);
    px(x+3,y+7,6,2,c1);
    px(x+3,y+9,6,1,c2);
  } else if(i===1){ // 胸甲：肩甲 + V领 + 躯干 + 腰带
    px(x+4,y+2,4,1,c2);
    px(x+1,y+3,2,3,c2); px(x+9,y+3,2,3,c2);
    px(x+3,y+3,6,2,c1);
    px(x+5,y+3,2,2,d);
    px(x+3,y+5,6,4,c1);
    px(x+4,y+6,4,1,c2);
    px(x+4,y+9,4,1,c2);
  } else { // 护腿：两条分开的腿
    px(x+2,y+2,3,4,c1); px(x+7,y+2,3,4,c1);
    px(x+2,y+6,3,1,c2); px(x+7,y+6,3,1,c2);
    px(x+2,y+7,3,3,c1); px(x+7,y+7,3,3,c1);
    px(x+1,y+10,4,1,c2); px(x+7,y+10,4,1,c2);
  }
}
function eqGroup(x,y,w,h,label){
  octx.fillStyle='#0b0f1a'; octx.fillRect(x-1,y-1,w+2,h+2);
  octx.fillStyle='#4b5462'; octx.fillRect(x,y,w,h);

function drawEquipHUD(){
  const L=equipLayout();
  // 防具
  eqGroup(L.ax,L.ay,L.GA,L.GAH,'防具');
  for(let i=0;i<3;i++){ const x=L.ax+L.pad+i*(L.AS+3), y=L.ay+L.labelH+L.pad;
    eqSlot(x,y,L.AS); armorIcon(x,y,L.AS,i); }
  // 主武器
  eqGroup(L.wx,L.wy,L.GW,L.GH,'武器');
  for(let i=0;i<3;i++){ const x=L.wx+L.pad+i*(L.WS+4), y=L.wy+L.labelH+L.pad;
    eqSlot(x,y,L.WS);
    drawText('?', x+(L.WS-6)/2, y+(L.WS-10)/2, '#7b8492', 2); }
  // 饰品
  eqGroup(L.sx,L.sy,L.GS,L.GSH,'饰品');
  for(let j=0;j<2;j++) for(let i=0;i<3;i++){ const x=L.sx+L.pad+i*(L.SS+2), y=L.sy+L.labelH+L.pad+j*(L.SS+2);
    eqSlot(x,y,L.SS); }
  // 剑
  const bx=L.swx, by=L.swy, bs=L.swordS;
  octx.fillStyle='#0b0f1a'; octx.fillRect(bx-1,by-1,bs+2,bs+2);
  octx.fillStyle='#4b5462'; octx.fillRect(bx,by,bs,bs);
  octx.fillStyle='#9aa3ae'; octx.fillRect(bx+bs/2-1,by+2,2,bs-8);
  octx.fillStyle='#6b7280'; octx.fillRect(bx+bs/2-4,by+bs-6,8,2);
  octx.fillStyle='#8a6440'; octx.fillRect(bx+bs/2-1,by+bs-4,2,3);
}
function fillSlots(el,n,labels){
  if(el.childElementCount) return;
  for(let i=0;i<n;i++){ const d=document.createElement('div'); d.className='eq-slot';
    d.textContent = labels ? (labels[i]||'') : ''; el.appendChild(d); }
}
const ARMOR_SVG=[
  '<svg width="34" height="34" viewBox="0 0 12 12" shape-rendering="crispEdges"><rect x="4" y="1" width="4" height="1" fill="#9aa5b1"/><rect x="3" y="2" width="6" height="1" fill="#9aa5b1"/><rect x="2" y="3" width="8" height="2" fill="#9aa5b1"/><rect x="3" y="5" width="6" height="1" fill="#232c38"/><rect x="2" y="5" width="1" height="3" fill="#74808e"/><rect x="9" y="5" width="1" height="3" fill="#74808e"/><rect x="3" y="6" width="6" height="2" fill="#9aa5b1"/><rect x="3" y="8" width="6" height="1" fill="#74808e"/></svg>',
  '<svg width="34" height="34" viewBox="0 0 12 12" shape-rendering="crispEdges"><rect x="4" y="1" width="4" height="1" fill="#74808e"/><rect x="1" y="2" width="2" height="3" fill="#74808e"/><rect x="9" y="2" width="2" height="3" fill="#74808e"/><rect x="3" y="2" width="6" height="2" fill="#9aa5b1"/><rect x="5" y="2" width="2" height="2" fill="#232c38"/><rect x="3" y="4" width="6" height="4" fill="#9aa5b1"/><rect x="4" y="5" width="4" height="1" fill="#74808e"/><rect x="4" y="8" width="4" height="1" fill="#74808e"/></svg>',
  '<svg width="34" height="34" viewBox="0 0 12 12" shape-rendering="crispEdges"><rect x="2" y="2" width="3" height="4" fill="#9aa5b1"/><rect x="7" y="2" width="3" height="4" fill="#9aa5b1"/><rect x="2" y="6" width="3" height="1" fill="#74808e"/><rect x="7" y="6" width="3" height="1" fill="#74808e"/><rect x="2" y="7" width="3" height="3" fill="#9aa5b1"/><rect x="7" y="7" width="3" height="3" fill="#9aa5b1"/><rect x="1" y="10" width="4" height="1" fill="#74808e"/><rect x="7" y="10" width="4" height="1" fill="#74808e"/></svg>'
];
function openEquip(){
  document.getElementById('equipWrap').classList.remove('hidden');
  document.querySelectorAll('#equipWrap [data-armor]').forEach(el=>{
    if(!el.innerHTML) el.innerHTML = ARMOR_SVG[+el.dataset.armor] || '';
  });
}
function openBag(){
  fillSlots(document.getElementById('bagGrid'),100,null);
  document.getElementById('bagWrap').classList.remove('hidden');
}
document.getElementById('eqClose').onclick=()=>document.getElementById('equipWrap').classList.add('hidden');
document.getElementById('equipBg').onclick=()=>document.getElementById('equipWrap').classList.add('hidden');
document.getElementById('bagClose').onclick=()=>document.getElementById('bagWrap').classList.add('hidden');
document.getElementById('bagBg').onclick=()=>document.getElementById('bagWrap').classList.add('hidden');
document.getElementById('bagBtn').onclick=openBag;

// ---------- 横屏提示 ----------
function checkOrientation(){
  const portrait = window.innerHeight > window.innerWidth;
  document.getElementById('rotate').classList.toggle('hidden', !portrait);
}
window.addEventListener('resize', checkOrientation);
checkOrientation();

document.getElementById('startBtn').onclick=()=>{
  document.getElementById('menu').classList.add('hidden');
  if(!hasSave) resetGame();
  hasSave=true; saveGame();
  initAudio(); startMusic();
  if(screen.orientation && screen.orientation.lock){
    try { const p=screen.orientation.lock('landscape'); if(p&&p.catch) p.catch(()=>{}); } catch(e){}
  }
  state='arrive';
  const sub=document.getElementById('subtitle');
  sub.classList.remove('hidden');
  setTimeout(()=>{ sub.classList.add('hidden'); state='city'; }, 1600);
};

buildGround(); resetGame(); hasSave=loadGame(); last=performance.now(); fpsLast=performance.now(); requestAnimationFrame(frame);
</script>
