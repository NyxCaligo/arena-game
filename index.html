<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>竞技场 · 生存</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05070d; }
  body { font-family:system-ui,-apple-system,"PingFang SC",sans-serif; color:#e2e8f0;
         touch-action:none; user-select:none; -webkit-user-select:none; }
  #cv { position:fixed; inset:0; display:block; touch-action:none; }
  #hud { position:fixed; inset:0; pointer-events:none; padding:10px; }
  .panel { background:rgba(15,23,42,.55); border-radius:10px; padding:7px 10px; backdrop-filter:blur(2px); }
  #top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .bar { height:11px; border-radius:6px; background:#1e293b; overflow:hidden; margin-top:5px; }
  .bar > i { display:block; height:100%; border-radius:6px; transition:width .12s; }
  #hpBar i { background:linear-gradient(90deg,#f43f5e,#fb7185); }
  #xpBar i { background:linear-gradient(90deg,#38bdf8,#818cf8); }
  .stat { font-size:12px; color:#94a3b8; text-shadow:0 1px 2px #000; }
  .stat b { color:#f8fafc; font-variant-numeric:tabular-nums; }
  .ov { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
        justify-content:center; gap:14px; background:rgba(5,7,13,.9); text-align:center; padding:24px; z-index:5; }
  .ov.hidden { display:none; }
  .ov h2 { font-size:24px; }
  .ov p { color:#94a3b8; font-size:14px; max-width:320px; line-height:1.6; }
  button { background:#4ade80; color:#052e16; border:none; border-radius:12px;
           font-size:17px; font-weight:700; padding:14px 34px; cursor:pointer; }
  button:active { transform:scale(.96); }
  #cards { position:fixed; left:0; right:0; bottom:0; z-index:6; display:flex; flex-direction:column;
           gap:9px; padding:14px 14px calc(14px + env(safe-area-inset-bottom)); }
  #cards .cap { text-align:center; color:#a5b4fc; font-size:14px; font-weight:700; letter-spacing:1px; }
  .card { width:100%; background:#131a2c; border:1px solid #27324a; border-radius:14px; padding:13px 16px;
          text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:4px; }
  .card:active { border-color:#4ade80; background:#172034; }
  .card .t { font-size:16px; font-weight:700; color:#f8fafc; }
  .card .d { font-size:13px; color:#94a3b8; }
  .card .rarity { font-size:11px; letter-spacing:1px; }
  .rarity.r1{color:#94a3b8}.rarity.r2{color:#38bdf8}.rarity.r3{color:#a855f7}.rarity.r4{color:#f59e0b}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div id="top">
    <div class="panel">
      <div class="stat">生命 <b id="hpTxt">100</b>/<span id="maxHpTxt">100</span></div>
      <div id="hpBar" class="bar"><i style="width:100%"></i></div>
    </div>
    <div class="panel" style="text-align:right">
      <div class="stat">时间 <b id="timeTxt">0:00</b></div>
      <div class="stat">击杀 <b id="killTxt">0</b></div>
    </div>
  </div>
  <div class="panel" style="position:fixed; left:10px; right:10px; top:88px;">
    <div class="stat">等级 <b id="lvTxt">1</b></div>
    <div id="xpBar" class="bar"><i style="width:0%"></i></div>
  </div>
</div>

<div id="start" class="ov">
  <h2>⚔️ 竞技场</h2>
  <p>走位躲怪，武器自动攻击。击杀怪物捡经验，升级三选一强化自己。活下来！</p>
  <button id="startBtn">开始</button>
</div>
<div id="over" class="ov hidden">
  <h2>💀 你倒下了</h2>
  <p id="overTxt"></p>
  <button id="againBtn">再来一局</button>
</div>
<div id="cards" class="hidden"></div>

<script>
"use strict";
const VW=180, VH=320;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const off = document.createElement('canvas'); off.width=VW; off.height=VH;
const octx = off.getContext('2d'); octx.imageSmoothingEnabled=false;

let cssScale=1, oxCss=0, oyCss=0;
function resize(){
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  cssScale = Math.min(cv.width/VW, cv.height/VH);
  oxCss = (cv.width - VW*cssScale)/2;
  oyCss = (cv.height - VH*cssScale)/2;
  ctx.imageSmoothingEnabled = false;
}
resize();
window.addEventListener('resize', resize);

// ---------- 状态 ----------
let state='menu', player, enemies, bullets, gems, parts;
let time=0, kills=0, level=1, xp=0, xpNeed=30, spawnTimer=0, last=0, shake=0, muzzle=0;

const UPGRADES = [
  {t:'生命上限 +25%', d:'最大生命提升，并回复同样数值', r:1, f(){ player.maxHp*=1.25; player.hp+=player.maxHp*0.25; }},
  {t:'伤害 +20%', d:'所有子弹伤害提升', r:2, f(){ player.dmg*=1.2; }},
  {t:'攻击速度 +15%', d:'武器发射更快', r:2, f(){ player.interval/=1.15; }},
  {t:'移动速度 +12%', d:'走位更灵活', r:1, f(){ player.speed*=1.12; }},
  {t:'生命回复 +1/秒', d:'缓慢回复生命', r:2, f(){ player.regen+=1; }},
  {t:'拾取范围 +30%', d:'经验宝石飞得更远', r:1, f(){ player.pickup*=1.3; }},
  {t:'经验加成 +20%', d:'获得经验更多', r:2, f(){ player.xpMult*=1.2; }},
  {t:'护甲 +2', d:'受到的伤害减少', r:2, f(){ player.armor+=2; }},
  {t:'多重射击 +1', d:'每次多射一颗子弹', r:3, f(){ player.shots+=1; }},
  {t:'子弹速度 +25%', d:'子弹飞得更快', r:1, f(){ player.bulletSpeed*=1.25; }},
  {t:'立即回复 50 生命', d:'马上回一口血', r:1, f(){ player.hp=Math.min(player.maxHp, player.hp+50); }},
  {t:'暴击 +15%', d:'概率造成 2 倍伤害', r:3, f(){ player.crit+=0.15; }},
];

const TYPES = {
  tri:  {sides:3, r:6,  hp:10, spd:36, dmg:5,  xp:4,  body:'#f87171', dark:'#991b1b', rot:0},
  sq:   {sides:4, r:7,  hp:20, spd:21, dmg:8,  xp:6,  body:'#fb923c', dark:'#c2410c', rot:0.8},
  pent: {sides:5, r:8,  hp:34, spd:18, dmg:11, xp:10, body:'#c084fc', dark:'#7e22ce', rot:1.2},
  hex:  {sides:6, r:10, hp:55, spd:15, dmg:14, xp:22, body:'#f472b6', dark:'#be185d', rot:1.6},
};

function newPlayer(){
  player = { x:VW/2, y:VH/2, r:9, hp:100, maxHp:100, speed:60,
    dmg:10, interval:0.7, shots:1, bulletSpeed:170,
    regen:0, armor:0, pickup:26, xpMult:1, crit:0, atkTimer:0, flash:0 };
}
function resetGame(){
  enemies=[]; bullets=[]; gems=[]; parts=[];
  time=0; kills=0; level=1; xp=0; xpNeed=30; spawnTimer=0.5; shake=0; muzzle=0;
  newPlayer(); updateHud();
}

// ---------- 输入 ----------
let joy={active:false, ox:0, oy:0, dx:0, dy:0};
const R=24;
function toV(x,y){ return [(x-oxCss)/cssScale, (y-oyCss)/cssScale]; }
function joyMove(x,y){
  const dx=x-joy.ox, dy=y-joy.oy, d=Math.hypot(dx,dy), m=d>R?R/d:1;
  joy.dx=dx*m; joy.dy=dy*m;
}
cv.addEventListener('touchstart', e=>{
  if(state!=='playing') return;
  const t=e.touches[0]; const [vx,vy]=toV(t.clientX,t.clientY);
  joy.active=true; joy.ox=vx; joy.oy=vy; joy.dx=joy.dy=0;
}, {passive:true});
cv.addEventListener('touchmove', e=>{
  if(!joy.active) return;
  const t=e.touches[0]; const [vx,vy]=toV(t.clientX,t.clientY);
  joyMove(vx,vy);
}, {passive:true});
cv.addEventListener('touchend', ()=>{ joy.active=false; joy.dx=joy.dy=0; }, {passive:true});
cv.addEventListener('mousedown', e=>{ if(state!=='playing')return; const [vx,vy]=toV(e.clientX,e.clientY); joy.active=true; joy.ox=vx; joy.oy=vy; joy.dx=joy.dy=0; });
cv.addEventListener('mousemove', e=>{ if(!joy.active)return; const [vx,vy]=toV(e.clientX,e.clientY); joyMove(vx,vy); });
cv.addEventListener('mouseup', ()=>{ joy.active=false; joy.dx=joy.dy=0; });

// ---------- 逻辑 ----------
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function pickType(){
  if(time<20) return 'tri';
  if(time<50) return Math.random()<0.65?'tri':'sq';
  if(time<90){ const r=Math.random(); return r<0.35?'tri':r<0.65?'sq':'pent'; }
  const r=Math.random(); return r<0.25?'tri':r<0.5?'sq':r<0.8?'pent':'hex';
}
function spawnEnemy(){
  const type=pickType(), T=TYPES[type];
  const side=Math.floor(Math.random()*4);
  let x,y;
  if(side===0){x=Math.random()*VW; y=-12;} else if(side===1){x=VW+12; y=Math.random()*VH;}
  else if(side===2){x=Math.random()*VW; y=VH+12;} else {x=-12; y=Math.random()*VH;}
  const df = 1 + time/55;
  enemies.push({type, x, y, r:T.r, hp:T.hp*df, maxHp:T.hp*df,
    spd:(T.spd+Math.random()*6)*Math.min(1.6, 1+time*0.004),
    dmg:T.dmg*df, xp:T.xp, hitCd:0, flash:0, rot:Math.random()*7, rotSpeed:T.rot});
}
function fire(){
  let tgt=null, bd=1e9;
  for(const e of enemies){ const d=dist(player,e); if(d<bd){bd=d; tgt=e;} }
  if(!tgt) return;
  const base=Math.atan2(tgt.y-player.y, tgt.x-player.x);
  const n=player.shots;
  for(let i=0;i<n;i++){
    const a=base+(i-(n-1)/2)*0.16;
    bullets.push({x:player.x+Math.cos(a)*(player.r+2), y:player.y+Math.sin(a)*(player.r+2),
      vx:Math.cos(a)*player.bulletSpeed, vy:Math.sin(a)*player.bulletSpeed, r:2, life:1.4});
  }
  muzzle=0.08;
}
function addPart(x,y,c,big){
  parts.push({x,y,vx:(Math.random()-0.5)*40, vy:(Math.random()-0.5)*40, r:(big?3:1.6)+Math.random()*2, life:big?0.5:0.35, c});
}
function hurtPlayer(raw){
  const d=Math.max(1, Math.round(raw-player.armor));
  player.hp-=d; player.flash=0.15; shake=Math.max(shake, 3);
  addPart(player.x, player.y, '#f87171', true);
  if(player.hp<=0){ player.hp=0; gameOver(); }
}
function gainXp(v){ xp+=v*player.xpMult; while(xp>=xpNeed){ xp-=xpNeed; level++; xpNeed=20+level*10; levelUp(); } updateHud(); }
function levelUp(){
  state='levelup';
  const pool=[...UPGRADES].sort(()=>Math.random()-0.5).slice(0,3);
  cardsEl.innerHTML='<div class="cap">升级！选择一个强化</div>';
  pool.forEach(u=>{
    const c=document.createElement('button'); c.className='card';
    c.innerHTML=`<span class="rarity r${u.r}">${'★'.repeat(u.r)}</span>
      <span class="t">${u.t}</span><span class="d">${u.d}</span>`;
    c.onclick=()=>{ u.f(); cardsEl.classList.add('hidden'); updateHud(); state='playing'; };
    cardsEl.appendChild(c);
  });
  cardsEl.classList.remove('hidden');
}
function gameOver(){
  state='over';
  document.getElementById('overTxt').innerHTML=
    `存活 <b>${fmtTime(time)}</b> · 击杀 <b>${kills}</b> · 等级 <b>${level}</b>`;
  document.getElementById('over').classList.remove('hidden');
}
function fmtTime(t){ const m=Math.floor(t/60), s=Math.floor(t%60); return `${m}:${s.toString().padStart(2,'0')}`; }

function update(dt){
  time+=dt;
  if(muzzle>0) muzzle-=dt; if(player.flash>0) player.flash-=dt; if(shake>0) shake-=dt*20;

  if(joy.active){
    const d=Math.hypot(joy.dx,joy.dy);
    if(d>0){ player.x+=joy.dx/d*player.speed*dt; player.y+=joy.dy/d*player.speed*dt; }
  }
  player.x=Math.max(player.r,Math.min(VW-player.r,player.x));
  player.y=Math.max(player.r,Math.min(VH-player.r,player.y));
  if(player.regen>0) player.hp=Math.min(player.maxHp, player.hp+player.regen*dt);

  spawnTimer-=dt;
  if(spawnTimer<=0){ spawnEnemy(); spawnTimer=Math.max(0.22,1.1-time*0.02)*(0.85+Math.random()*0.3); }

  for(const e of enemies){
    const d=dist(player,e); if(d<1) continue;
    e.x+=(player.x-e.x)/d*e.spd*dt; e.y+=(player.y-e.y)/d*e.spd*dt;
    if(e.flash>0) e.flash-=dt; e.hitCd-=dt;
    e.rot += e.rotSpeed*dt;
    if(d<player.r+e.r && e.hitCd<=0){ hurtPlayer(e.dmg); e.hitCd=0.6; }
  }
  player.atkTimer-=dt;
  if(player.atkTimer<=0 && enemies.length){ fire(); player.atkTimer=player.interval; }

  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i]; b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    let dead=b.life<=0||b.x<-15||b.x>VW+15||b.y<-15||b.y>VH+15;
    if(!dead){
      for(let j=enemies.length-1;j>=0;j--){
        const e=enemies[j];
        if(dist(b,e)<b.r+e.r){
          const crit=Math.random()<player.crit, dmg=b.dmg*(crit?2:1);
          e.hp-=dmg; e.flash=0.1; addPart(e.x,e.y, crit?'#fbbf24':'#fca5a5');
          if(e.hp<=0){ enemies.splice(j,1); kills++; gems.push({x:e.x,y:e.y,r:2.5,v:e.xp,life:30}); addPart(e.x,e.y,'#f87171',true); }
          dead=true; break;
        }
      }
    }
    if(dead) bullets.splice(i,1);
  }
  for(let i=gems.length-1;i>=0;i--){
    const g=gems[i]; g.life-=dt;
    const d=dist(player,g);
    if(d<player.pickup){ g.x+=(player.x-g.x)/d*120*dt; g.y+=(player.y-g.y)/d*120*dt; }
    if(d<player.r+g.r){ gems.splice(i,1); gainXp(g.v); }
    else if(g.life<=0) gems.splice(i,1);
  }
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; if(p.life<=0) parts.splice(i,1); }
  updateHud();
}

// ---------- 渲染 ----------
const specks = (()=>{ const a=[]; for(let i=0;i<70;i++) a.push({x:Math.random()*VW,y:Math.random()*VH,c:Math.random()<0.5}); return a; })();
function px(x,y,w,h,c){ octx.fillStyle=c; octx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
function oc(x,y,r){ octx.beginPath(); octx.arc(x,y,r,0,7); octx.fill(); }
function poly(x,y,r,sides,rot){
  octx.beginPath();
  for(let i=0;i<sides;i++){
    const a=rot + i*Math.PI*2/sides;
    const vx=x+Math.cos(a)*r, vy=y+Math.sin(a)*r;
    i?octx.lineTo(vx,vy):octx.moveTo(vx,vy);
  }
  octx.closePath();
}

function drawPlayer(){
  let tgt=null, bd=1e9;
  for(const e of enemies){ const d=dist(player,e); if(d<bd){bd=d; tgt=e;} }
  const ang = tgt?Math.atan2(tgt.y-player.y,tgt.x-player.x):0;
  const bob = Math.sin(time*9)*0.8;
  const y = player.y+bob;

  // 影子
  octx.fillStyle='rgba(0,0,0,.3)'; octx.beginPath(); octx.ellipse(player.x, player.y+player.r+1, player.r*0.95, 2.5, 0, 0, 7); octx.fill();
  // 枪管（简单干净）
  octx.save(); octx.translate(player.x, y); octx.rotate(ang);
  px(player.r*0.4, -1.2, player.r*1.3, 2.4, '#475569');
  if(muzzle>0){ octx.fillStyle='#fde047'; octx.beginPath(); octx.arc(player.r*1.6, 0, 2.2, 0, 7); octx.fill(); }
  octx.restore();
  // 身体：蓝色小球
  oc(player.x, y, player.r+1); // 描边
  const body = player.flash>0 ? '#ffffff' : '#38bdf8';
  octx.fillStyle=body; oc(player.x, y, player.r-1);
  octx.fillStyle='#0369a1'; octx.beginPath(); octx.arc(player.x, y+player.r*0.4, player.r-1, 0, 7); octx.fill();
  // 高光
  octx.fillStyle='rgba(255,255,255,.6)'; oc(player.x-player.r*0.35, y-player.r*0.4, player.r*0.28);
  // 眼睛（两点）+ 微笑
  octx.fillStyle='#082f49';
  px(player.x-3, y-1, 2, 2); px(player.x+1, y-1, 2, 2);
  octx.strokeStyle='#082f49'; octx.lineWidth=1;
  octx.beginPath(); octx.arc(player.x, y+1.5, 2.2, 0.15*Math.PI, 0.85*Math.PI); octx.stroke();
}

function drawEnemy(e){
  const T=TYPES[e.type];
  const x=e.x, y=e.y, r=e.r;
  // 影子
  octx.fillStyle='rgba(0,0,0,.28)'; octx.beginPath(); octx.ellipse(x, y+r+1, r*0.8, 2, 0, 0, 7); octx.fill();
  // 描边 + 几何身体
  poly(x,y,r+1,T.sides,e.rot); octx.fillStyle='#0b0f1a'; octx.fill();
  poly(x,y,r-1,T.sides,e.rot); octx.fillStyle = e.flash>0?'#ffffff':T.body; octx.fill();
  // 眼睛（简单深色圆点，不跟着旋转）
  octx.fillStyle='#0b0f1a';
  if(T.sides>=6){ px(x-1, y-1.5, 2, 4); }                    // 六边形：独眼
  else if(T.sides===5){ px(x-3, y-1, 2, 3); px(x+1, y-1, 2, 3); }
  else { px(x-3, y-1.5, 2, 3); px(x+1, y-1.5, 2, 3); }
}

function render(){
  octx.clearRect(0,0,VW,VH);
  octx.fillStyle='#111827'; octx.fillRect(0,0,VW,VH);
  // 地面格
  octx.strokeStyle='#182236'; octx.lineWidth=1;
  for(let gx=12; gx<VW; gx+=12){ octx.beginPath(); octx.moveTo(gx,0); octx.lineTo(gx,VH); octx.stroke(); }
  for(let gy=12; gy<VH; gy+=12){ octx.beginPath(); octx.moveTo(0,gy); octx.lineTo(VW,gy); octx.stroke(); }
  for(const s of specks){ octx.fillStyle = s.c?'#0f1626':'#1a2438'; px(s.x,s.y,1,1); }

  for(const g of gems){
    octx.fillStyle='rgba(103,232,249,.35)'; octx.beginPath(); octx.arc(g.x,g.y,g.r*2.4,0,7); octx.fill();
    octx.fillStyle='#67e8f9';
    octx.beginPath(); octx.moveTo(g.x,g.y-g.r*1.6); octx.lineTo(g.x+g.r*1.6,g.y); octx.lineTo(g.x,g.y+g.r*1.6); octx.lineTo(g.x-g.r*1.6,g.y); octx.closePath(); octx.fill();
  }
  for(const e of enemies) drawEnemy(e);
  for(const b of bullets){ octx.fillStyle='#fde047'; oc(b.x,b.y,b.r); }
  for(const p of parts){ octx.globalAlpha=Math.max(0,p.life/(p.life>0.35?0.5:0.35)); octx.fillStyle=p.c; oc(p.x,p.y,p.r); octx.globalAlpha=1; }

  drawPlayer();

  if(joy.active){
    octx.strokeStyle='rgba(148,163,184,.4)'; octx.lineWidth=2;
    octx.beginPath(); octx.arc(joy.ox,joy.oy,R,0,7); octx.stroke();
    octx.fillStyle='rgba(148,163,184,.55)'; oc(joy.ox+joy.dx, joy.oy+joy.dy, 6);
  }

  // 上屏
  ctx.fillStyle='#05070d'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  ctx.drawImage(off, oxCss, oyCss, VW*cssScale, VH*cssScale);
  ctx.restore();
}

function updateHud(){
  document.getElementById('hpTxt').textContent=Math.max(0,Math.ceil(player.hp));
  document.getElementById('maxHpTxt').textContent=Math.round(player.maxHp);
  document.getElementById('hpBar').querySelector('i').style.width=Math.max(0,player.hp/player.maxHp*100)+'%';
  document.getElementById('xpBar').querySelector('i').style.width=Math.min(100,xp/xpNeed*100)+'%';
  document.getElementById('lvTxt').textContent=level;
  document.getElementById('timeTxt').textContent=fmtTime(time);
  document.getElementById('killTxt').textContent=kills;
}

function frame(now){
  const dt=Math.min((now-last)/1000,0.05); last=now;
  if(state==='playing') update(dt);
  render();
  requestAnimationFrame(frame);
}
document.getElementById('startBtn').onclick=()=>{ document.getElementById('start').classList.add('hidden'); resetGame(); state='playing'; last=performance.now(); };
document.getElementById('againBtn').onclick=()=>{ document.getElementById('over').classList.add('hidden'); resetGame(); state='playing'; };
resetGame(); last=performance.now(); requestAnimationFrame(frame);
</script>
</body>
</html>
